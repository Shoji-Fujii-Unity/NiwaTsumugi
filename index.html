<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#22301f">
<meta name="description" content="庭つむぎ — めぐる四季、百年の庭。ブラウザだけで動く、ゆっくり育つガーデニングゲーム。">
<title>庭つむぎ — NIWA TSUMUGI</title>

<!-- ▼ ネットから読むライブラリ（全て CDN / 無くても動くよう各機能は存在確認つき） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>

<style>
/* ============ tokens ============ */
:root{
  --s1:#cfe3f2; --s2:#f6e7ee; --s3:#9dbb84; --s4:#5f8257;   /* 空と大地（JSが季節＋時刻で塗る） */
  --sun:#fff3c4; --haze:rgba(255,255,255,.35);
  --ink:#2b2419; --ink2:#5d5347;
  --paper:rgba(255,252,244,.93); --paper2:rgba(255,252,244,.72);
  --line:rgba(70,55,35,.18); --sh:rgba(25,35,20,.22);
  --leaf:#4d7c53; --leaf-d:#345a3a; --gold:#d9a93c; --terra:#c96a44; --sky:#6f9fd0; --dew:#57a6c4;
  --wood:#8a6540; --wood-d:#5f4429; --soil:#4a3524; --soil-d:#2c1e14;
  --r:16px;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{background:#101710;color:var(--ink);-webkit-user-select:none;user-select:none;
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-size:calc(14px * var(--fs))}
h1,h2,.serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-weight:600}
button{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(60,50,35,.28);border-radius:3px}

/* ============ frame ============ */
#app{position:relative;max-width:470px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 26%,var(--s3) 44%,var(--s4) 100%);transition:background 2s linear}
body.desk #app{box-shadow:0 0 0 1px rgba(255,255,255,.18),0 22px 60px rgba(0,0,0,.55)}
#scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:12}
#stars{position:absolute;inset:0 0 45% 0;pointer-events:none;z-index:2;opacity:0;transition:opacity 2.5s}

/* ============ header ============ */
header{position:relative;z-index:20;padding:calc(env(safe-area-inset-top) + 7px) 11px 6px;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.4));border-bottom:1px solid var(--line);
  backdrop-filter:blur(6px)}
.hrow{display:flex;align-items:center;gap:8px}
.logo{font-size:calc(18px * var(--fs));letter-spacing:.15em;line-height:1.05}
.logo small{display:block;font-size:calc(8px * var(--fs));letter-spacing:.26em;opacity:.5;font-weight:400;font-family:inherit}
.spacer{flex:1}
#clock{text-align:right;line-height:1.3;font-size:calc(12px * var(--fs))}
#clock b{font-family:"Shippori Mincho B1",serif}
#clock .sub{opacity:.66;font-size:calc(10px * var(--fs))}
.iconbtn{border:1px solid var(--line);background:var(--paper2);border-radius:999px;width:33px;height:33px;font-size:15px;
  display:grid;place-items:center;padding:0}
.iconbtn:active{transform:scale(.94)}
#centBar{height:3px;background:rgba(255,255,255,.45);border-radius:2px;margin-top:5px;overflow:hidden}
#centBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ec98f,#f3d264,#e89ab4);transition:width .8s}

/* ============ stage ============ */
#stage{flex:1;position:relative;overflow:hidden;z-index:5;display:flex;flex-direction:column}
#yardWrap{flex:1;overflow:auto;padding:8px 9px;position:relative}
#yardWrap::after{content:"";display:block;height:calc(env(safe-area-inset-bottom) + 160px)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;font-size:calc(10.5px * var(--fs));margin:0 2px 7px}
.chip{border-radius:999px;padding:3px 9px;background:var(--paper2);border:1px solid var(--line);white-space:nowrap;
  font-size:calc(10.5px * var(--fs))}
.chip b{font-family:"Shippori Mincho B1",serif;font-size:calc(12px * var(--fs))}
.chip.hot{background:#ffe9a8;border-color:#d9a93c;font-weight:700}
.chip.cold{background:#dff0fb;border-color:#8bb8d6}

/* ---- 予報 ---- */
#wx{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:8px 10px;margin-bottom:8px;box-shadow:0 3px 10px var(--sh)}
#wx .big{font-size:26px;line-height:1}
#wx .txt{flex:1;min-width:0}
#wx .t1{font-size:calc(12.5px * var(--fs));font-weight:700}
#wx .t2{font-size:calc(10.5px * var(--fs));opacity:.72;line-height:1.45}
#wx .nx{text-align:right;font-size:calc(9.6px * var(--fs));opacity:.82;line-height:1.45;flex:0 0 32%;max-width:33%;overflow-wrap:anywhere}
#wx .nx b{font-size:17px}

/* ---- 今日の庭 ---- */
#today{background:linear-gradient(135deg,rgba(255,247,222,.96),rgba(255,255,255,.9));border:1px solid rgba(200,155,60,.4);
  border-radius:var(--r);padding:10px 11px;margin-bottom:8px;box-shadow:0 4px 14px var(--sh)}
#today h3{margin:0 0 5px;font-size:calc(13.5px * var(--fs));letter-spacing:.06em}
#today ul{margin:0;padding-left:1.1em;font-size:calc(11.6px * var(--fs));line-height:1.75}
#today .go{margin-top:8px}

/* ============ 庭（描画まわり） ============ */
#yard{position:relative;border-radius:20px;overflow:hidden;
  box-shadow:0 10px 26px var(--sh),inset 0 0 0 1px rgba(255,255,255,.22);
  background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 26%,#b9c99a 30%,var(--s3) 42%,var(--s4) 100%);
  transition:background 2s linear}
#skyband{position:relative;height:118px;overflow:hidden}
#sunmoon{position:absolute;width:52px;height:52px;margin:-26px 0 0 -26px;transition:left 1.6s linear,top 1.6s linear}
#sunmoon .sun{position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#fffdf0,var(--sun) 55%,#f8d97a);
  box-shadow:0 0 26px 10px rgba(255,238,170,.55)}
#sunmoon.moon .sun{background:radial-gradient(circle at 38% 34%,#fffffa,#e7edf6 60%,#c3cede);box-shadow:0 0 18px 6px rgba(215,230,255,.4)}
#sunmoon.moon .sun::after{content:"";position:absolute;left:24px;top:12px;width:9px;height:9px;border-radius:50%;background:rgba(150,165,190,.35)}
.cloud{position:absolute;opacity:.85;filter:blur(.4px)}
.cloud path,.cloud ellipse{fill:rgba(255,255,255,.92)}
#treeline{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:76px;display:block}
#hills{position:absolute;left:0;right:0;bottom:26px;width:100%;height:60px;display:block;opacity:.5}
#veil{position:absolute;inset:0;pointer-events:none;z-index:14;background:linear-gradient(180deg,rgba(20,30,60,.55),rgba(15,22,40,.4));
  opacity:0;transition:opacity 2s}
#yardglow{position:absolute;inset:0;pointer-events:none;z-index:13;opacity:0;transition:opacity 2s;
  background:radial-gradient(60% 40% at 50% 8%,rgba(255,214,140,.5),rgba(255,180,120,0) 70%)}
#decor{position:absolute;left:0;right:0;top:0;height:118px;pointer-events:none;z-index:3;overflow:hidden}
.deco{position:absolute;text-align:center;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.32))}
.deco small{display:block;font-size:8px;letter-spacing:.02em;color:rgba(255,255,255,.95);text-shadow:0 1px 2px rgba(0,0,0,.75);margin-top:1px}
.ripple{position:absolute;left:50%;top:55%;width:12px;height:6px;margin:-3px 0 0 -6px;border:1.5px solid rgba(255,255,255,.6);
  border-radius:50%;animation:rip 3.4s ease-out infinite}
.ripple:nth-child(2){animation-delay:1.7s}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(4);opacity:0}}

#creatures{position:absolute;inset:0;pointer-events:none;z-index:16;overflow:hidden}
.cre{position:absolute;font-size:22px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.cre .tag{position:absolute;left:50%;transform:translateX(-50%);top:-14px;font-size:9px;white-space:nowrap;
  background:rgba(255,255,255,.85);border-radius:999px;padding:1px 6px;color:#3a332b}

/* ---- 苗床 ---- */
#beds{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 9px 14px}
.bed{position:relative;border-radius:12px;min-height:112px;padding:0;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  border:3px solid var(--wood);
  background:
    radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.34),rgba(0,0,0,0) 60%),
    radial-gradient(circle at 20% 30%,rgba(255,255,255,.07) 0 2px,transparent 2px),
    radial-gradient(circle at 70% 60%,rgba(0,0,0,.12) 0 2px,transparent 2px),
    linear-gradient(180deg,var(--soil),var(--soil-d));
  background-size:auto,26px 26px,19px 19px,auto;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.16),inset 0 -9px 16px rgba(0,0,0,.4),0 4px 9px rgba(0,0,0,.28);
  transition:transform .18s,box-shadow .3s}
.bed::after{content:"";position:absolute;inset:0;background:#1a1008;opacity:calc(var(--w,.5) * .38);pointer-events:none;transition:opacity .6s}
.bed:active{transform:translateY(1px) scale(.985)}
.bed.wet{box-shadow:inset 0 3px 0 rgba(255,255,255,.16),inset 0 -9px 16px rgba(0,0,0,.45),0 0 0 2px rgba(120,190,220,.55)}
.bed.bloomed{box-shadow:inset 0 3px 0 rgba(255,255,255,.16),inset 0 -9px 16px rgba(0,0,0,.4),0 0 14px rgba(255,232,160,.6)}
.bed.ready{animation:readyPulse 1.9s ease-in-out infinite}
@keyframes readyPulse{50%{box-shadow:inset 0 3px 0 rgba(255,255,255,.16),inset 0 -9px 16px rgba(0,0,0,.4),0 0 0 3px rgba(255,222,110,.85)}}
.bed.flash{animation:flashBed 1s ease-in-out 3}
@keyframes flashBed{50%{box-shadow:0 0 0 4px rgba(255,214,90,.95)}}
.bed.lock{border-style:dashed;border-color:rgba(255,255,255,.4);
  background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.34));color:#fff;align-items:center;justify-content:center;
  font-size:calc(10.5px * var(--fs));text-align:center;gap:2px}
.bed.lock span{font-size:19px}
.bed.drop{outline:3px dashed rgba(255,238,170,.95);outline-offset:-6px;transform:scale(1.03)}
.bed.empty .plus{position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.34);border-radius:9px;display:grid;place-items:center;
  color:rgba(255,255,255,.72);font-size:19px}
.bed svg.plant{width:100%;height:84px;display:block;overflow:visible;position:relative;z-index:1}
.bname{position:relative;z-index:1;font-size:calc(9.8px * var(--fs));background:rgba(255,252,244,.86);border-radius:999px;
  padding:1px 7px;margin-bottom:5px;max-width:96%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bbar{position:absolute;left:6px;right:6px;top:5px;height:3px;background:rgba(0,0,0,.34);border-radius:2px;overflow:hidden;z-index:2}
.bbar i{display:block;height:100%;background:linear-gradient(90deg,#a8d98a,#f4e07c)}
.bw{position:absolute;left:6px;right:6px;top:9px;height:2px;background:rgba(0,0,0,.3);border-radius:2px;overflow:hidden;z-index:2}
.bw i{display:block;height:100%;background:linear-gradient(90deg,#63b6d8,#a9dff0)}
.bbadges{position:absolute;top:13px;right:5px;display:flex;flex-direction:column;gap:1px;font-size:11px;z-index:3;
  text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bsoil{position:absolute;bottom:4px;left:6px;font-size:9px;opacity:.85;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.sway{transform-origin:50% 100%;animation:sw 5.2s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(2.1deg)}}
.droop{transform-origin:50% 100%;transform:rotate(7deg) translateY(2px) scaleY(.94)}

/* ---- 種ストリップ ---- */
#pouch{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 88px);z-index:13;display:flex;align-items:center;gap:8px;
  margin:9px 2px 0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;
  box-shadow:0 -2px 14px var(--sh)}
#pouch .ph{display:flex;flex-direction:column;gap:1px;font-size:calc(8.6px * var(--fs));opacity:.75;margin:0;
  flex:0 0 72px;max-width:72px;line-height:1.3}
#pouch .ph b{font-size:calc(11.5px * var(--fs));opacity:1}
#pouchList{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;min-height:52px;flex:1}
.seed{flex:0 0 auto;width:54px;border:1px solid var(--line);border-radius:10px;background:linear-gradient(180deg,#fffdf6,#f2ead8);
  padding:2px 2px 3px;text-align:center;cursor:grab;position:relative;box-shadow:0 2px 5px rgba(0,0,0,.12)}
.seed svg{width:100%;height:30px;display:block;overflow:visible}
.seed .sn{font-size:8px;line-height:1.15;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.seed .sc{position:absolute;top:-5px;right:-4px;background:var(--leaf);color:#fff;border-radius:999px;font-size:9px;padding:1px 5px;
  box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seed.sortable-ghost{opacity:.35}
.seed.sel{outline:2.5px solid var(--leaf);outline-offset:1px;background:linear-gradient(180deg,#f0ffe4,#dcefc9)}
#pouch .empty{font-size:calc(11px * var(--fs));opacity:.62;padding:12px 4px}

/* ---- ツールバー ---- */
.tools{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 46px);z-index:24;display:flex;gap:6px;
  padding:7px 9px;background:linear-gradient(180deg,rgba(255,252,244,0),rgba(255,252,244,.86) 38%)}
.tbtn{flex:1;border-radius:13px;border:1px solid var(--line);background:var(--paper);padding:8px 4px 7px;font-size:calc(11.5px * var(--fs));
  text-align:center;box-shadow:0 3px 9px var(--sh);line-height:1.25}
.tbtn small{display:block;font-size:calc(9.2px * var(--fs));opacity:.66;margin-top:1px}
.tbtn:active{transform:translateY(1px)}
.tbtn.pri{background:linear-gradient(180deg,#63a06b,var(--leaf));color:#fff;border-color:var(--leaf-d)}
.tbtn.dis{opacity:.42}

/* ============ panels ============ */
.panel{flex:1;overflow:auto;padding:9px 11px calc(env(safe-area-inset-bottom) + 130px);display:none;position:relative;z-index:16}
.panel.on{display:block}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;margin-bottom:9px;
  box-shadow:0 4px 12px var(--sh)}
h2.t{font-size:calc(15px * var(--fs));margin:1px 0 7px;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:calc(12.8px * var(--fs))}
.row:first-of-type{border-top:0}
.row .sp{flex:1;min-width:0}
.nm{font-weight:700;font-size:calc(13.2px * var(--fs))}
.sub{font-size:calc(10.8px * var(--fs));opacity:.74;line-height:1.5;margin-top:1px}
.subtabs{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.subtab{border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:5px 12px;font-size:calc(11.4px * var(--fs))}
.subtab.on{background:var(--leaf);color:#fff;border-color:var(--leaf-d)}
.sws{display:flex;gap:3px;flex:0 0 auto}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.15)}
.hr{height:1px;background:var(--line);margin:9px 0}
.small{font-size:calc(10.8px * var(--fs));opacity:.74;line-height:1.65}
.btn{border:1px solid var(--line);background:#fffdf7;border-radius:10px;padding:6px 11px;font-size:calc(12.2px * var(--fs));
  box-shadow:0 2px 5px rgba(0,0,0,.1)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#63a06b,var(--leaf));color:#fff;border-color:var(--leaf-d)}
.btn.gold{background:linear-gradient(180deg,#f0c869,var(--gold));color:#3a2b0c;border-color:#b98d22}
.btn.dis{opacity:.4;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
textarea{width:100%;min-height:72px;border-radius:10px;border:1px solid var(--line);padding:8px;font-size:10.2px;
  background:#fffdf8;color:#3a332b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
input[type=range]{width:100%}
.pbar2{height:6px;background:rgba(0,0,0,.12);border-radius:4px;overflow:hidden;margin-top:4px}
.pbar2 i{display:block;height:100%;background:linear-gradient(90deg,#8ec98f,#f3d264)}
.logrow{font-size:calc(12.2px * var(--fs));line-height:1.6;padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.logrow:first-of-type{border-top:0}
.when{flex:0 0 74px;font-size:calc(10.2px * var(--fs));opacity:.6;line-height:1.4;padding-top:2px}
.poem{font-size:calc(13.2px * var(--fs));line-height:2.1;white-space:pre-wrap;font-family:"Shippori Mincho B1","Yu Mincho",serif}
.xbox{border-top:1px solid var(--line);padding:9px 0}
.xbox:first-of-type{border-top:0}
.xq{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:calc(12.4px * var(--fs))}
.hintline{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.glyph{width:36px;height:42px;display:inline-block;flex:0 0 36px}
.glyph.gray{filter:grayscale(1);opacity:.42}
.detailTop{display:flex;gap:11px;align-items:flex-start}
.detailTop svg{width:76px;height:94px;flex:0 0 76px}
.big{font-size:calc(18px * var(--fs));font-weight:700;font-family:"Shippori Mincho B1",serif}
.meter{display:flex;align-items:center;gap:7px;font-size:calc(11.4px * var(--fs));margin-top:3px}
.meter .mbar{flex:1;height:7px;background:rgba(0,0,0,.12);border-radius:4px;overflow:hidden}
.meter .mbar i{display:block;height:100%}
.spark{width:100%;height:46px;display:block;margin-top:4px}

/* ============ nav / sheet / toast ============ */
nav{position:absolute;left:0;right:0;bottom:0;z-index:22;display:flex;background:rgba(255,252,244,.94);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(6px)}
nav button{flex:1;border:0;background:none;padding:6px 2px 7px;font-size:calc(9.4px * var(--fs));color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav button .ic{font-size:17px}
nav button.on{color:var(--leaf-d)}
nav button.on::before{content:"";position:absolute;top:0;left:26%;right:26%;height:2px;background:var(--leaf);border-radius:2px}
nav button .dot{position:absolute;top:4px;right:24%;width:6px;height:6px;border-radius:50%;background:var(--terra);
  box-shadow:0 0 0 2px rgba(255,252,244,.9)}
#back{position:absolute;inset:0;z-index:35;background:rgba(18,24,14,.5);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(2px)}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,#fffdf7,#f7f1e3);
  border-radius:22px 22px 0 0;transform:translateY(115%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:6px 14px calc(env(safe-area-inset-bottom) + 14px);max-height:82%;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.3)}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(0,0,0,.16);margin:4px auto 8px}
#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);z-index:60;display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:none;padding:0 14px}
.toast{background:rgba(35,42,30,.9);color:#f9f5e9;font-size:calc(12.2px * var(--fs));padding:7px 14px;border-radius:999px;
  text-align:center;line-height:1.45;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#errbox{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 40px);z-index:99;background:#5c1a12;color:#ffe;
  display:none;padding:10px;border-radius:10px;font-size:10px;font-family:ui-monospace,monospace;white-space:pre-wrap;max-height:40%;overflow:auto}

/* ============ intro ============ */
#intro{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px;color:#f8f4e8;backdrop-filter:blur(10px);
  background:radial-gradient(120% 55% at 50% 4%,rgba(255,232,170,.20),rgba(255,232,170,0) 62%),
    linear-gradient(180deg,#3b5b44,#243929 56%,#131e17)}
#intro h1{font-size:40px;letter-spacing:.3em;margin:0 0 4px;text-shadow:0 3px 18px rgba(0,0,0,.5)}
#intro .rm{font-size:9.5px;letter-spacing:.42em;opacity:.72;margin-bottom:16px}
#intro .art{width:230px;height:96px;margin-bottom:12px;opacity:.95}
#intro p{font-size:calc(12.6px * var(--fs));line-height:2;max-width:310px;margin:0 0 22px}
#intro button{border:1px solid rgba(255,255,255,.62);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;
  padding:12px 32px;font-size:14px;letter-spacing:.1em}
#intro .lg{display:flex;gap:8px;margin-top:20px;font-size:11px;flex-wrap:wrap;justify-content:center}
#intro .lg b{opacity:.6;font-weight:400;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 10px}
#intro .lg b.on{opacity:1;background:#fffdf7;color:#26301f;border-color:transparent}
#intro .libs{margin-top:18px;font-size:9.5px;opacity:.5;letter-spacing:.08em;line-height:1.8}

/* ============ zen ============ */
#app.zen header,#app.zen nav,#app.zen .tools,#app.zen .chiprow,#app.zen #wx,#app.zen #today,#app.zen #pouch{display:none}
#app.zen #yardWrap{padding:0}
#app.zen #yard{border-radius:0;box-shadow:none;min-height:100dvh}
#zenHint{display:none;position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:26;
  text-align:center;font-size:11px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#app.zen #zenHint{display:block}
#zenHaiku{display:none;position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 20px);z-index:26;text-align:center;
  color:#fffdf3;font-family:"Shippori Mincho B1",serif;font-size:15px;line-height:2.1;white-space:pre-wrap;
  text-shadow:0 2px 12px rgba(0,0,0,.65);pointer-events:none}
#app.zen #zenHaiku{display:block}

/* ============ scene extras ============ */
@keyframes drift{0%{transform:translateX(-160px)}100%{transform:translateX(490px)}}
@keyframes flick{0%,100%{opacity:0}3%{opacity:.85}7%{opacity:.1}11%{opacity:.7}16%{opacity:0}}
#flash{position:absolute;inset:0;background:#f2f7ff;opacity:0;pointer-events:none;z-index:17}
#flash.on{animation:flick 1.5s ease-out 1}
.cre.walk{animation:walk var(--dur,16s) linear 1 forwards}
.cre.fly{animation:fly var(--dur,12s) ease-in-out 1 forwards}
@keyframes walk{0%{left:-10%;opacity:0}10%{opacity:1}88%{opacity:1}100%{left:102%;opacity:0}}
@keyframes fly{0%{left:-10%;top:60%;opacity:0}12%{opacity:1}30%{top:26%}52%{top:52%}70%{top:18%}88%{opacity:1}100%{left:100%;top:40%;opacity:0}}
.bird{position:absolute;font-size:13px;opacity:.85;animation:fly var(--dur,20s) linear 1 forwards}
body.calm .sway,body.calm .cloud,body.calm .ripple{animation:none}
body.calm #scene{opacity:.55}
@media (prefers-reduced-motion: reduce){.sway,.cloud,.ripple{animation:none}}
@media (min-width:520px){ :root{--r:18px} }

[ct]
plant={sp}を植えた。土は少し痩せている。|Planted {sp}. The soil is a little tired.|种下了{sp}，土壤略见贫瘠。
bloom1=初めて、{sp}が咲いた。|For the first time, {sp} bloomed.|{sp}第一次开花了。

dormant={sp}は地上から姿を消した。根は生きている。|{sp} vanished above ground. The root lives on.|{sp}在地上消失了，但根还活着。

event=できごと：{ev}|Event: {ev}|记事：{ev}
wx=空は{wx}だった。|The sky was {wx}.|天空是{wx}。
rain=雲が低く庭全体が濡れた。|Low clouds, the whole garden got wet.|云层很低，整个庭园湿润了。
storm=雷が近く、背の高い花が折れた。|Thunder close by; a tall bloom snapped.|雷声很近，一朵高处的花折了。
frost=遅霜の夜。{n}株が折り返し点を失った。|A late frost. {n} plants lost their turning point.|晚霜之夜，{n}株失去了转机。
snow=雪が庭を覆い、すべてが息をひそめた。|Snow covered the garden; all held its breath.|雪覆盖庭园，万物屏息。

prune={sp}を切り戻した。花が長もちする。|Deadheaded {sp}. The bloom will last.|修剪了{sp}，花期延长。
newy=第{n}年、風は同じ方向から吹いた。|Year {n}, the wind blew from the same direction.|第{n}年，风从同一个方向吹来。
legacy=第{c}百年の種を土に返した。|Sowed the seed of century {c}.|将第{c}个百年的种子归还于土。

[yp]
0;春の風が新しい畝を撫でていった。|Spring wind brushed across the new beds.|春风拂过新的苗床。
0;雪の下で何かが目を覚ました音がした。|Something stirred beneath the snow.|雪底下有东西醒来的声音。
0;陽が延びて庭は匂いで語り始めた。|The light lengthened, the garden spoke in scent.|白昼变长，庭园用气息交谈。
1;蝉の声に花は黙って応じた。|The flowers answered the cicadas by blooming.|花以沉默的盛开回应蝉鸣。

3;霜が庭を白く塗りすべてが息をひそめた。|Frost painted the garden white, all held its breath.|霜把庭园涂白，万物屏息。
3;雪の下で百年目がうすく夢を見ている。|Under snow, the century dreams faintly.|雪下一百年正淡淡地做梦。

[cp]
—— 記録 ——|—— Record ——|—— 记录 ——
植えた種は {p} 粒、咲いた回数は {b}。|{p} seeds were set down, blooming came {b} times.|种下 {p} 粒，开花 {b} 次。
手は {w} 回水を運び、いちばん通った来客は {vis} だった。|Hands carried water {w} times, the most frequent guest was {vis}.|双手浇水 {w} 次，最常来访的是{vis}。
空は {wx} の日がいちばん多かった。|The sky was {wx} more often than anything else.|最常出现的天空是{wx}。
百年のあいだ、まだ誰も見ぬ花を三度土から引き出した。|Three times in a century you drew up a flower no one had seen.|一百年里，三次从土里唤出无人见过的花。
それでも庭はまだ若い。|And still the garden is young.|而庭园仍然年轻。

<script>
"use strict";
/* ==================================================================
   庭つむぎ — NIWA TSUMUGI
   単一ファイルのガーデニング育成。
   [A] データと言語  [B] 状態と時間  [C] シミュレーション
   [D] 演出（空・粒子・音）  [E] 描画と操作  [F] 起動
   外部ライブラリ（GSAP / PixiJS / Tone.js / Sortable / confetti / localForage）は
   すべて存在確認つき。無くてもゲームは成立します。
   ================================================================== */

/* ---------- [A] 基本 ---------- */
var LANGS=["ja","en","zh"],LNAME=["日本語","English","中文"];
var U={},SHAPE={},SEASONS=[],WX={},WXID=[],SP={},SPIDS=[],HYB=[],HYBKEY={},CMP={},VIS=[],VISN={},
    ORN=[],ORNM={},MILE=[],MILEN={},CT={},EVT={},HAIKU=[[],[],[],[]],CP=[];
var S=null,lang="ja",view="garden",bookTab="species",flashBeds=[],catching=false,dragging=false;

var DPS=6,DPY=24,CENTURY=100,HGCAP=5,HGNEED=4*3600*1000,LS="niwatsumugi.v3";
var SPEEDS=[{ms:3*3600*1000,k:"speed_real"},{ms:30*60*1000,k:"speed_slow"},{ms:5*60*1000,k:"speed_norm"},
            {ms:45*1000,k:"speed_fast"},{ms:6*1000,k:"speed_now"}];
var PLOTREQ=[0,0,0,0,0,0,22,45,72,105,145,190],NBED=12,BASE_BEDS=6;
var CANCOST=[0,120,300];

function $(s){return document.querySelector(s)}
function el(id){return document.getElementById(id)}
function warn(m){var d=el("errbox");if(!d)return;d.style.display="block";d.textContent+=(d.textContent?"\n":"")+m}
window.onerror=function(m,l,c){warn("FATAL "+m+" @"+l+":"+c);return false};
function li(){var i=LANGS.indexOf(lang);return i<0?0:i}
function pick(s){if(typeof s!=="string")return "";var a=s.split("|"),i=li();return a.length<=i?a[0]:a[i]}
function t(k,p){var s=U[k];if(!s)return k;return fmt(pick(s),p)}
function fmt(s,p){if(!s)return "";if(!p)return s;return s.replace(/\{(\w+)\}/g,function(m,k){return p[k]===undefined?m:p[k]})}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":"&quot;"})}
function rnd(n){return Math.floor(Math.random()*n)}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function hasOne(l,x){return l.indexOf(x)>=0}

(function parseTXT(){
  var raw=el("TXT").textContent.split("\n"),sec="",i,line,f,k,key,val;
  for(i=0;i<raw.length;i++){
    line=raw[i].trim();
    if(!line||line.charAt(0)==="#")continue;
    if(line.charAt(0)==="["){sec=line.slice(1,-1).trim();continue}
    if(sec==="ui"||sec==="ct"||sec==="shape"){
      k=line.indexOf("=");
      if(k<0){warn("skip "+sec+": "+line);continue}
      key=line.slice(0,k);val=line.slice(k+1);
      if(sec==="ui")U[key]=val;else if(sec==="ct")CT[key]=val;else SHAPE[key]=val;
      continue
    }
    f=line.split(";");
    if(sec==="sp"){
      if(f.length<17){warn("skip sp: "+f[0]);continue}
      SP[f[0]]={id:f[0],n:f[1],sh:f[2],c1:f[3],c2:f[4],h:+f[5],germ:+f[6],life:+f[7],wit:+f[8],
        per:f[9]==="1",seas:f[10],rar:+f[11],price:+f[12],seedn:+f[13],val:+f[14],note:f[15],sp:f[16]}
    }else if(sec==="hyb"){
      if(f.length<3)continue;HYB.push(f);HYBKEY[f[1]+"+"+f[2]]=f[0];HYBKEY[f[2]+"+"+f[1]]=f[0]
    }else if(sec==="cmp"){
      if(f.length<3)continue;var w=+f[2];CMP[f[0]+"+"+f[1]]=w;CMP[f[1]+"+"+f[0]]=w
    }else if(sec==="vis"){ if(f.length<5)continue;VIS.push(f);VISN[f[0]]=f }
    else if(sec==="orn"){ if(f.length<5)continue;ORN.push(f);ORNM[f[0]]=f }
    else if(sec==="wx"){ if(f.length<5)continue;WX[f[0]]={id:f[0],n:f[1],ic:f[2],g:+f[3],ev:+f[4]};WXID.push(f[0]) }
    else if(sec==="evt"){ if(f.length<3)continue;EVT[f[0]]={id:f[0],ic:f[1],n:f[2]} }
    else if(sec==="mile"){ if(f.length<4)continue;MILE.push([f[0],f[1],+f[2],+f[3]]) }
    else if(sec==="season"){ SEASONS.push(line) }
    else if(sec==="cp"){ CP.push(line) }
    else if(sec==="yp"){ var p2=line.split(";");if(p2.length<2)continue;
      var si=+p2[0];if(si<0||si>3)si=0;HAIKU[si].push(p2.slice(1).join(";")) }
  }
  for(i=0;i<MILE.length;i++)MILEN[MILE[i][0]]=MILE[i];
  SPIDS=Object.keys(SP);
})();
function seasonName(i){return pick(SEASONS[i]||"?")}
function wxOf(id){return WX[id]||WX.clear||{id:"clear",n:"clear|Clear|晴",ic:"☀️",g:1,ev:.3}}
function wxName(id){return pick(wxOf(id).n)}
function wxIcon(id){return wxOf(id).ic}

/* ---------- [B] 状態と時間 ---------- */
function emptyArr(){return [null,null,null,null,null,null,null,null,null,null,null,null]}
function nArr(n,v){var a=[],i;for(i=0;i<n;i++)a.push(v);return a}
function baseOpen(){var a=nArr(NBED,false),i;for(i=0;i<BASE_BEDS;i++)a[i]=true;return a}
function freshState(){
  return {v:3,lang:null,sound:true,vol:0.55,speed:2,calm:false,fs:1,lastReal:Date.now(),day:0,
    plots:emptyArr(),soil:nArr(NBED,0.75),cloth:nArr(NBED,false),bedOpen:baseOpen(),
    pouch:{dandelion:2,tulip:1,crocus:1},dew:24,renown:0,compost:2,clothN:1,hg:1,hgAt:Date.now(),
    disc:{},bloomed:{},bloomY:{},visited:{},hybTry:{},hintLvl:{},chron:[],ms:{},orn:{},seenSeason:{},
    wx:{today:"clear",tomA:"clear",tomS:"clear"},wxHist:{},buffs:{grow:0,growM:1,shop:0},
    lastWaterDay:-9,waterUses:0,can:1,
    stats:{plant:0,harvest:0,water:0,bloom:0,dewTotal:0,found:0,prune:0,compost:0,cmp:0,evt:0,zen:0,storm:0,open:0},
    century:1,centDone:false,legacy:0,todaySeen:-1,intro:false,savedAt:0}}
function normState(o){
  var d=freshState(),s=Object.assign(d,o||{});
  s.stats=Object.assign(freshState().stats,(o&&o.stats)||{});
  s.buffs=Object.assign({grow:0,growM:1,shop:0},(o&&o.buffs)||{});
  s.wx=Object.assign({today:"clear",tomA:"clear",tomS:"clear"},(o&&o.wx)||{});
  if(!Array.isArray(s.plots)||s.plots.length!==NBED)s.plots=emptyArr();
  if(!Array.isArray(s.soil)||s.soil.length!==NBED)s.soil=nArr(NBED,0.75);
  if(!Array.isArray(s.cloth)||s.cloth.length!==NBED)s.cloth=nArr(NBED,false);
  if(!Array.isArray(s.bedOpen)||s.bedOpen.length!==NBED)s.bedOpen=baseOpen();
  for(var bi=0;bi<BASE_BEDS;bi++)s.bedOpen[bi]=true;
  if(!WX[s.wx.today])s.wx.today="clear";
  if(!WX[s.wx.tomA])s.wx.tomA=s.wx.today;
  if(!WX[s.wx.tomS])s.wx.tomS=s.wx.tomA;
  if(!SPEEDS[s.speed])s.speed=2;
  if(!s.can)s.can=1;
  if(!s.bloomY||typeof s.bloomY!=="object")s.bloomY={};
  if(typeof s.compost!=="number")s.compost=2;
  if(typeof s.clothN!=="number")s.clothN=1;
  if(typeof s.awayDays!=="number")s.awayDays=0;
  return s}
var IDB=null;
function initStore(){
  if(window.localforage&&localforage.createInstance){
    try{IDB=localforage.createInstance({name:"niwatsumugi",storeName:"save"});IDB.setItem("_p",1).catch(function(){})}catch(e){IDB=null}}}
function save(){
  if(!S)return;S.savedAt=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(IDB){try{IDB.setItem("save",S).catch(function(){})}catch(e){}}}
function loadLocal(){
  var raw=null,o;
  try{raw=localStorage.getItem(LS)}catch(e){return null}
  if(!raw)return null;
  try{o=JSON.parse(raw);if(!o||typeof o!=="object")return null;return normState(o)}catch(e){return null}}
function pullIDB(after){
  if(!IDB)return;
  try{IDB.getItem("save").then(function(o){
    if(o&&o.plots&&(!S||(o.savedAt||0)>(S.savedAt||0))){S=normState(o);lang=S.lang||lang;if(after)after()}
  },function(){})}catch(e){}}

function yearOf(d){return Math.floor(d/DPY)+1}
function seasonOf(d){return Math.floor((d%DPY)/DPS)}
function dayOfSeason(d){return (Math.floor(d)%DPS)+1}
function todayIdx(){return Math.floor(S.day)}
function MS_DAY(){return SPEEDS[S.speed].ms}
function hgRefresh(){
  var now=Date.now(),e=now-S.hgAt,got=false;
  if(e<0){S.hgAt=now;return false}
  while(e>=HGNEED){e-=HGNEED;if(S.hg<HGCAP){S.hg++;got=true}}
  S.hgAt=now-e;return got}
function hgTimeLeft(){if(S.hg>=HGCAP)return 0;var n=HGNEED-(Date.now()-S.hgAt);return n<0?0:n}
function fmtDur(ms){
  var m=Math.floor(ms/60000),h;if(m<60)return m+"m";h=Math.floor(m/60);m=m%60;return h+"h"+(m?" "+m+"m":"")}

/* ---------- 補助 ---------- */
function discCount(){return Object.keys(S.disc).length}
function hybCount(){var n=0,i;for(i=0;i<HYB.length;i++)if(S.disc[HYB[i][0]])n++;return n}
function isHyb(id){return !!(SP[id]&&SP[id].sp==="h")}
function inSeason(sp,seas){var k=["w","s","m","a"][seas];return sp.seas.indexOf("*")>=0||sp.seas.indexOf(k)>=0}
function spName(id){return SP[id]?pick(SP[id].n):id}
function bedUnlocked(i){return !!S.bedOpen[i]}
function openCost(i){return {dew:25*(i-BASE_BEDS+1),compost:1+Math.floor((i-BASE_BEDS)/2)}}
function openBed(i){
  var c=openCost(i);
  if(i<BASE_BEDS||S.bedOpen[i]||S.renown<PLOTREQ[i]){Sfx.no();return}
  if(S.dew<c.dew||S.compost<c.compost){
    toast(fmt(t("open_cost"),{n:c.dew,c:c.compost})+" / "+t("dew")+" "+Math.floor(S.dew)+" ・ "+t("compost")+" "+S.compost);Sfx.no();return}
  S.dew-=c.dew;S.compost-=c.compost;S.bedOpen[i]=true;S.stats.open++;S.renown+=2;log("openbed");
  Sfx.mile();save();renderBeds(true)}
function neighbours(i){var cols=3,r=Math.floor(i/cols),c=i%cols,ns=[];
  if(c>0)ns.push(i-1);if(c<cols-1)ns.push(i+1);if(r>0)ns.push(i-cols);if(r<3)ns.push(i+cols);return ns}
function soilMult(i){return 0.82+0.36*clamp(S.soil[i]||0,0,1)}
function cmpPairs(i){
  var p=S.plots[i],out=[],ns=neighbours(i),k,q,w;
  if(!p||p.dead)return out;
  for(k=0;k<ns.length;k++){q=S.plots[ns[k]];if(!q||q.dead)continue;
    w=CMP[p.sp+"+"+q.sp];if(w!==undefined)out.push({j:ns[k],w:w,other:q.sp})}
  return out}
function cmpMult(i){
  var ps=cmpPairs(i),sum=0,k;
  for(k=0;k<ps.length;k++)sum+=ps[k].w;
  if(S.orn.arch&&sum>0)sum=Math.round(sum*1.5);
  return clamp(1+sum/100,0.78,1.32)}
function gardenBonus(){
  var b=1,m=0,i,p;
  for(i=0;i<NBED;i++){p=S.plots[i];if(!p||p.dead||p.dormant||p.prog<1)continue;
    if(p.sp==="moss")m++;if(p.sp==="centgrass")b+=0.2}
  if(m>5)m=5;return b*(1+m*0.03)}
function buffGrow(){return (S.buffs.grow>0)?(S.buffs.growM||1.1):1}
function canLevel(){return S.can||1}

function toast(msg,ms){
  var w=el("toasts"),d=document.createElement("div");
  if(!w)return;d.className="toast";d.innerHTML=msg;w.appendChild(d);
  while(w.children.length>3)w.removeChild(w.firstChild);
  setTimeout(function(){d.style.transition="opacity .6s";d.style.opacity=0;
    setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},650)},ms||2400)}
function log(ty,p){
  S.chron.push({t:ty,p:p||{},c:S.century,y:yearOf(S.day),s:seasonOf(S.day),d:dayOfSeason(S.day)});
  if(S.chron.length>600)S.chron.splice(0,S.chron.length-600)}
function paramText(k,v){
  if(k==="sp")return "<b>"+esc(spName(v))+"</b>";
  if(k==="vis"&&VISN[v])return "<b>"+esc(pick(VISN[v][1]))+"</b>";
  if(k==="orn"&&ORNM[v])return "<b>"+esc(pick(ORNM[v][1]))+"</b>";
  if(k==="m"&&MILEN[v])return "<b>"+esc(pick(MILEN[v][1]))+"</b>";
  if(k==="ev"&&EVT[v])return "<b>"+esc(pick(EVT[v].n))+"</b>";
  if(k==="wx")return "<b>"+esc(wxName(v))+"</b>";
  return esc(v)}
function chronText(e){
  var src=e.p||{},p={},k;
  if(e.t==="haiku"){var arr=HAIKU[e.s]||[];return pick(arr[(src.v||0)%Math.max(1,arr.length)]||"")}
  if(!CT[e.t])return "";
  for(k in src)if(src.hasOwnProperty(k))p[k]=paramText(k,src[k]);
  return fmt(pick(CT[e.t]),p)}

/* ---------- [C] シミュレーション ---------- */
var WXW=[
  {clear:.32,cloudy:.20,rain:.24,storm:.05,mist:.14,frost:.05},
  {clear:.42,cloudy:.18,rain:.20,storm:.18,mist:.02},
  {clear:.32,cloudy:.22,rain:.22,storm:.05,mist:.14,frost:.05},
  {clear:.22,cloudy:.22,rain:.06,mist:.14,frost:.30,snow:.28}];
function rollWeather(seas){
  var w=WXW[seas]||WXW[0],tot=0,k;
  for(k in w)if(w.hasOwnProperty(k)&&WX[k])tot+=w[k];
  var r=Math.random()*tot;
  for(k in w){if(!w.hasOwnProperty(k)||!WX[k])continue;r-=w[k];if(r<=0)return k}
  return "clear"}
function forecastOK(){return Math.random()<(S.orn.weathervane?1:0.74)}
function isWet(){var w=S.wx.today;return w==="rain"||w==="storm"}
function tick(){
  if(!S)return false;
  var now=Date.now(),days=(now-S.lastReal)/MS_DAY(),guard=0,away,step;
  if(days<0)days=0;
  if(days<=0.0002){hgRefresh();return false}
  away=days>0.30;catching=true;

    g.push('<circle cy="-22" r="2.2" fill="'+c2+'"/>')}

function budShape(sp,sc){

function sproutShape(pr){

function plantSVG(p,sp){
  var g=[],i,n,x,r,ly,ll,topY,inner;
  if(!p||!sp)return '<svg class="plant" viewBox="0 0 60 96"><ellipse cx="30" cy="88" rx="15" ry="4.2" fill="rgba(0,0,0,.18)"/>'+
    '<path d="M18 86 q6 -5 12 -1 t12 -2" stroke="rgba(255,255,255,.2)" stroke-width="2" fill="none"/></svg>';

  if(sp.sh==="carpet"){n=5+Math.round(6*pr);
    for(i=0;i<n;i++){x=8+(i*44/Math.max(1,n-1))+(i%2?2:0);r=(3.4+3.4*pr)*(1-(i%3)*.14);
      g.push('<circle cx="'+x.toFixed(1)+'" cy="'+(88-r*.5).toFixed(1)+'" r="'+r.toFixed(1)+'" fill="'+(i%2?sp.c1:sp.c2)+'"/>')}
    return '<svg class="plant" viewBox="0 0 60 96">'+g.join("")+"</svg>"}
  if(p.dead){
    g.push('<path d="M30 89 C 36 62 43 44 49 44" stroke="#8a7250" stroke-width="2.1" fill="none"/>');
    g.push('<circle cx="49" cy="45" r="3.4" fill="#b39a72"/>');
    g.push('<path d="M30 89 C 26 74 22 66 18 64" stroke="#8a7250" stroke-width="1.6" fill="none" opacity=".8"/>');
    return '<svg class="plant" viewBox="0 0 60 96">'+g.join("")+"</svg>"}
  var stemH=sp.h*(.26+.74*pr),topY=89-stemH,dry=(p.water<0.28&&!p.dormant);
  var col=p.dormant?"#9c8f6d":(dry?"#7f8b52":"#4f7a48");
  g.push('<path d="M30 89 C 29 '+(89-stemH*.55).toFixed(1)+', 31 '+(topY+stemH*.25).toFixed(1)+', 30 '+topY.toFixed(1)+
    '" stroke="'+col+'" stroke-width="2.2" fill="none"/>');
  if(pr>0.16){ly=89-stemH*.42;ll=5+7*pr;
    g.push('<ellipse cx="'+(30-ll*.8).toFixed(1)+'" cy="'+ly.toFixed(1)+'" rx="'+ll.toFixed(1)+'" ry="'+(ll*.42).toFixed(1)+'" fill="'+(dry?"#7d8a55":"#5c8a52")+'"/>');
    g.push('<ellipse cx="'+(30+ll*.8).toFixed(1)+'" cy="'+(ly-stemH*.16).toFixed(1)+'" rx="'+(ll*.9).toFixed(1)+'" ry="'+(ll*.38).toFixed(1)+'" fill="'+(dry?"#8b9860":"#6b9a5c")+'"/>')}
  if(p.dormant){g.push('<ellipse cx="30" cy="86" rx="7.5" ry="2.8" fill="#8f9c78"/>');
    return '<svg class="plant" viewBox="0 0 60 96">'+g.join("")+"</svg>"}
  if(pr<0.78)inner=sproutShape(pr);
  else if(pr<1)inner=budShape(sp,.9);
  else{inner=bloomShape(sp,1);
    if(p.seeded)inner+='<circle cx="9" cy="-2" r="2.6" fill="#f6e6a8"/><circle cx="-8" cy="1" r="2" fill="#f6e6a8" opacity=".8"/>';
    if(p.pruned)inner+='<circle cx="0" cy="4" r="1.6" fill="#8fbf7a"/>'}
  g.push('<g class="'+(dry?"droop":"sway")+'" transform="translate(30,'+topY.toFixed(1)+')">'+inner+"</g>");
  return '<svg class="plant" viewBox="0 0 60 96">'+g.join("")+"</svg>"}

function ownList(){var a=[],i;for(i=0;i<SPIDS.length;i++)if(S.pouch[SPIDS[i]]>0)a.push(SPIDS[i]);return a}

  S.pouch[id]--;
  S.plots[i]={sp:id,prog:0,bloomAge:0,water:0.85,seeded:false,dead:false,blooming:false,
    dormant:!inSeason(sp,seasonOf(S.day)),pruned:false,ext:1};

  S.stats.plant++;S.disc[id]=true;log("plant",{sp:id});Sfx.plant();

function waterTargets(){var a=[],i,p;for(i=0;i<NBED;i++){p=S.plots[i];if(p&&!p.dead&&(p.water||0)<0.95)a.push(i)}return a}
function waterAt(i){var p=S.plots[i];
  if(!p||p.dead)return false;

  p.water=1;S.stats.water++;Sfx.water();Pop.water(i);save();renderBeds();renderToday();return true}

  if(lvl===1)tg=tg.slice(0,3);

function harvestAt(i){

  S.pouch[sp.id]=(S.pouch[sp.id]||0)+seeds;
  v=Math.round(sp.val*(r?1:0.45)*(1+Math.min(0.6,S.renown/900))*(1+0.08*S.legacy));
  addDew(v);S.stats.harvest++;S.renown+=1;S.soil[i]=clamp((S.soil[i]||0)-0.08,0,1);
  Sfx.harvest();Pop.burst(Pop.rect(i),[sp.c1,sp.c2,"#f6e6a8"],26,80,.5);
  toast("<b>"+esc(spName(sp.id))+"</b> "+t("got_seeds",{n:seeds})+" / "+t("got_dew",{n:v}),2500);
  S.plots[i]=null;save();render()}

    '<rect x="0" y="'+(h-1)+'" width="'+w+'" height="1" fill="rgba(0,0,0,.12)"/>'+

function applyPrefs(){
  document.body.classList.toggle("calm",!!S.calm);
  document.documentElement.style.setProperty("--fs",S.fs||1)}
/* ---- シート ---- */
function openSheet(h){el("sheetBody").innerHTML=h;el("sheet").classList.add("on");el("back").classList.add("on")}
function closeSheet(){el("sheet").classList.remove("on");el("back").classList.remove("on")}
function sheetPlantPick(i){
  var own=ownList(),a=[],j,id,sp,blocked;
  a.push('<h2 class="t">'+t("plant_here")+"</h2>");
  if(!own.length)a.push('<div class="small">'+t("no_seed")+"</div>");
  for(j=0;j<own.length;j++){id=own[j];sp=SP[id];blocked=(sp.sp==="pond"&&!S.orn.pond);
    a.push('<div class="row"'+(blocked?' style="opacity:.5"':"")+' data-plant="'+id+'" data-slot="'+i+'">');
    a.push('<span style="width:44px;flex:0 0 44px;display:inline-block">'+
      plantSVG({prog:1,seeded:false,blooming:true,dormant:false,dead:false,water:1},sp)+"</span>");
    a.push('<span class="sp"><span class="nm">'+esc(spName(id))+'</span><div class="sub">');
    if(blocked)a.push(t("need_pond"));
    else a.push(seasLabel(sp)+" ・ "+fmt(t("own_n"),{n:S.pouch[id]})+" ・ "+fmt(t("to_bloom"),{n:sp.germ}));
    a.push("</div></span>");
    if(!blocked)a.push('<span class="chip">'+t("plant_here")+"</span>");
    a.push("</div>")}
  a.push('<div class="hr"></div><button class="btn" data-close="1">'+t("close")+"</button>");
  openSheet(a.join(""))}
function renderSheetBed(i){closeSheet();bedSheet(i)}
function bedSheet(i){
  var p=S.plots[i],sp,a=[],dl,ps,k,cmp=[];
  if(!S.bedOpen[i])return;
  if(!p){sheetPlantPick(i);return}
  sp=SP[p.sp];dl=p.prog<1?Math.max(1,Math.ceil((1-p.prog)*sp.germ/Math.max(.25,wxOf(S.wx.today).g))):0;
  ps=cmpPairs(i);
  for(k=0;k<ps.length;k++)cmp.push(esc(spName(ps[k].other))+" "+(ps[k].w>0?"+":"")+ps[k].w+"%");
  a.push('<div class="detailTop"><span>'+plantSVG(p,sp)+"</span><span><div class='big'>"+esc(spName(p.sp))+"</div>");
  a.push('<div class="small">'+stageLabel(p)+" ・ "+seasLabel(sp)+(isHyb(p.sp)?" ・ "+t("hybrid_tag"):"")+
    (p.pruned?" ・ "+t("pruned"):"")+"</div>");
  a.push('<div class="small" style="margin-top:4px">'+esc(pick(sp.note))+"</div></span></div><div class='hr'></div>");
  a.push(meter("💧 "+t("water_word"),p.water||0,"linear-gradient(90deg,#63b6d8,#a9dff0)"));
  a.push(meter("🍂 "+t("soil_word"),S.soil[i]||0,"linear-gradient(90deg,#b98a52,#8a6540)"));
  a.push('<div class="row"><span class="chip">'+(S.soil[i]<0.35?"⚠️":"✔")+'</span><span class="sp"><div class="sub">'+
    (S.soil[i]<0.35?t("soil_bad"):t("soil_good"))+(S.cloth[i]?" ・ 🧣 "+t("cloth"):"")+"</div></span></div>");
  if(dl)a.push('<div class="row"><span class="chip">🌱</span><span class="sp"><div class="sub">'+fmt(t("to_bloom"),{n:dl})+"</div></span></div>");
  else if(p.seeded)a.push('<div class="row"><span class="chip">✨</span><span class="sp"><div class="sub">'+t("seed_ready")+"</div></span></div>");
  if(cmp.length)a.push('<div class="row"><span class="chip">🍀</span><span class="sp"><div class="sub">'+
    fmt(t("companion_tag"),{n:cmp.length})+" ："+cmp.join(" / ")+"</div></span></div>");
  a.push('<div class="grid2" style="margin-top:10px">');
  a.push('<button class="btn pri" data-act="water" data-slot="'+i+'">💧 '+t("water")+"</button>");
  if(p.blooming)a.push('<button class="btn pri" data-act="harvest" data-slot="'+i+'">🌾 '+t("harvest")+"</button>");
  else a.push('<button class="btn dis">🌾 '+t("harvest")+"</button>");
  if(p.blooming&&!p.pruned)a.push('<button class="btn" data-act="prune" data-slot="'+i+'">✂️ '+t("prune")+"</button>");
  else a.push('<button class="btn dis">✂️ '+t("prune")+"</button>");
  a.push('<button class="btn'+(S.compost<1?" dis":"")+'" data-act="compost" data-slot="'+i+'">🍂 '+t("compost_use")+"</button>");
  a.push('<button class="btn'+((S.clothN||0)<1||S.cloth[i]?" dis":"")+'" data-act="cloth" data-slot="'+i+'">🧣 '+t("cloth_use")+"</button>");
  a.push('<button class="btn" data-act="clear" data-slot="'+i+'">'+t("clear")+"</button>");
  a.push('</div><div style="margin-top:8px"><button class="btn" data-close="1">'+t("close")+"</button></div>");
  openSheet(a.join(""))}
function showAway(){
  var list=S.chron.slice(-16).reverse(),a=['<h2 class="t serif">'+t("away_title")+"</h2>"],i,e,when;
  if(!list.length)a.push('<div class="small">'+t("away_none")+"</div>");
  for(i=0;i<list.length;i++){e=list[i];
    when=fmt(t("year_n"),{n:e.y})+" "+seasonName(e.s)+" "+e.d;
    a.push('<div class="logrow"><span class="when">'+when+"</span><span>"+chronText(e)+"</span></div>")}
  a.push('<div style="margin-top:8px"><button class="btn pri" data-close="1">'+t("close")+"</button></div>");
  openSheet(a.join(""))}
/* ---- エクスポート ---- */
function doExport(){var s;
  try{s=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    el("ioBox").value=s;
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(s).then(function(){toast(t("copied"))},function(){toast(t("copied"))});
    else toast(t("copied"))}
  catch(e){toast(t("import_fail"))}}
function doImport(){var v,o;
  v=el("ioBox").value.trim();
  if(!v){Sfx.no();return}
  try{o=JSON.parse(decodeURIComponent(escape(atob(v))));
    if(!o||!Array.isArray(o.plots))throw new Error("bad");
    S=normState(o);lang=S.lang||lang;view="garden";applyPrefs();save();render();toast(t("imported"))}
  catch(e){toast(t("import_fail"));Sfx.no()}}
/* ---------- [F] 起動と配線 ---------- */
var selSeed=null,sortBed=[],sortPouch=null;
function uiSoundBtn(){var b=el("sndBtn");if(b)b.textContent=S.sound?"🔔":"🔕"}
function buildNav(){
  var items=[["garden","🌿",t("nav_garden")],["seed","🌰",t("nav_seed")],
    ["book","📖",t("nav_book")],["log","🗒",t("nav_log")],["set","⚙️",t("nav_set")]];
  var a=[],i,bs,n=0;
  if(S.awayDays>1)n=1;
  for(i=0;i<items.length;i++)a.push('<button data-v="'+items[i][0]+'"><span class="ic">'+items[i][1]+"</span><span>"+items[i][2]+"</span>"+
    (items[i][0]==="log"&&n?'<span class="dot"></span>':"")+"</button>");
  el("nav").innerHTML=a.join("");
  bs=document.querySelectorAll("#nav button");
  for(i=0;i<bs.length;i++)bs[i].onclick=function(){Sfx.tap();view=this.getAttribute("data-v");closeSheet();render()}}
function destroySort(){
  var i;for(i=0;i<sortBed.length;i++){try{sortBed[i].destroy()}catch(e){}}
  sortBed=[];if(sortPouch){try{sortPouch.destroy()}catch(e){}sortPouch=null}}
function initPouchSort(){
  if(!window.Sortable)return;
  var host=el("pouchList");if(!host)return;
  if(sortPouch){try{sortPouch.destroy()}catch(e){}}
  try{sortPouch=new Sortable(host,{group:{name:"seed",pull:"clone",put:false},sort:false,animation:150,
    ghostClass:"sortable-ghost",onStart:function(){dragging=true},
    onEnd:function(){dragging=false;setTimeout(function(){renderBeds(true)},40)}})}catch(e){}}
function initBedSort(){
  if(!window.Sortable)return;
  destroySort();
  var beds=document.querySelectorAll("#beds .bed[data-i]"),i;
  for(i=0;i<beds.length;i++)(function(node){
    try{sortBed.push(new Sortable(node,{group:{name:"seed",pull:false,put:true},sort:false,
      onAdd:function(ev){
        var id=ev.item.getAttribute("data-id");
        if(ev.item.parentNode)ev.item.parentNode.removeChild(ev.item);
        var idx=+node.getAttribute("data-i");
        dragging=false;
        if(id&&plantAt(idx,id)){closeSheet()}
      }}))}catch(e){}})(beds[i]);
  var all=document.querySelectorAll("#beds .bed");
  for(i=0;i<all.length;i++)(function(node){
    node.addEventListener("dragover",function(e){node.classList.add("drop")});
    node.addEventListener("dragleave",function(){node.classList.remove("drop")});
    node.addEventListener("drop",function(){node.classList.remove("drop")});
  })(all[i])}
function zenOn(){
  var app=el("app"),h=HAIKU[seasonOf(S.day)]||[];
  app.classList.add("zen");S.stats.zen++;Sfx.tap();
  var z=el("zenHaiku"),g=el("zenHint");
  if(z)z.textContent=pick(h[rnd(h.length)]||"");
  if(g)g.textContent=t("zen_out")+" ・ "+t("zen_tip");
  save()}
function setLang(L){lang=L;S.lang=L;document.documentElement.lang=L;Audio2.setSeason(seasonOf(S.day));save();buildNav();render();closeSheet()}
function flashAt(list){flashBeds=list.slice();renderBeds(true);
  setTimeout(function(){flashBeds=[];if(view==="garden")renderBeds(true)},3200)}
function bedTap(i){
  if(selSeed&&S.bedOpen[i]&&!S.plots[i]){
    if(plantAt(i,selSeed)){if(S.pouch[selSeed]<=0)selSeed=null;renderPouch();return}}
  Sfx.tap();bedSheet(i)}
function bind(){
  el("beds").addEventListener("click",function(e){
    var el2=e.target.closest?e.target.closest("[data-i],[data-lk],[data-open]"):null,i;
    if(!el2)return;
    if(el2.hasAttribute("data-lk")){toast(fmt(t("locked_by"),{n:PLOTREQ[+el2.getAttribute("data-lk")]}));Sfx.no();return}
    if(el2.hasAttribute("data-open")){openBed(+el2.getAttribute("data-open"));return}
    i=+el2.getAttribute("data-i");if(!S.bedOpen[i])return;bedTap(i)});
  el("tools").addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("[data-t]"):null;
    if(!b)return;
    var k=b.getAttribute("data-t");
    if(k==="water")waterAll();else if(k==="hg")useHG();else if(k==="zen")zenOn()});
  el("pouchList").addEventListener("click",function(e){
    var b=e.target.closest?e.target.closest("[data-seed]"):null;
    if(!b)return;
    var id=b.getAttribute("data-seed");
    selSeed=(selSeed===id)?null:id;Sfx.tap();renderPouch()});
  document.addEventListener("click",function(e){
    var b,o,bt,hb,gp,parts,sp2,it,lf,pp;
    if(!e.target.closest)return;
    if(e.target.closest("[data-today]")){S.todaySeen=todayIdx();S.awayDays=0;save();render();return}
    if(e.target.closest("[data-close]")){closeSheet();return}
    b=e.target.closest("[data-buy]");if(b){buySeed(b.getAttribute("data-buy"));return}
    o=e.target.closest("[data-orn]");if(o){buyOrn(o.getAttribute("data-orn"));return}
    it=e.target.closest("[data-item]");if(it){buyItem(it.getAttribute("data-item"));return}
    if(e.target.closest("[data-can]")){buyCan();return}
    pp=e.target.closest("[data-plant]");
    if(pp){if(plantAt(+pp.getAttribute("data-slot"),pp.getAttribute("data-plant")))closeSheet();return}
    bt=e.target.closest("[data-btab]");if(bt){Sfx.tap();bookTab=bt.getAttribute("data-btab");render();return}
    lf=e.target.closest("[data-lf]");if(lf){logFilter=lf.getAttribute("data-lf");render();return}
    hb=e.target.closest("[data-hint]");if(hb){buyHint(hb.getAttribute("data-hint"));return}
    sp2=e.target.closest("[data-sp]");
    if(sp2){speciesSheet(sp2.getAttribute("data-sp"));return}
    var sd=e.target.closest("#pSeed [data-seed]");
    if(sd){selSeed=sd.getAttribute("data-seed");view="garden";render();return}
    gp=e.target.closest("[data-gopair]");
    if(gp){parts=gp.getAttribute("data-gopair").split(":");Sfx.tap();view="garden";closeSheet();flashAt([+parts[0],+parts[1]])}
    var act=e.target.closest("[data-act]");
    if(act){var ac=act.getAttribute("data-act"),s=+act.getAttribute("data-slot");
      if(ac==="water"){waterAt(s);renderSheetBed(s)}
      else if(ac==="harvest"){closeSheet();harvestAt(s)}
      else if(ac==="prune"){pruneAt(s);renderSheetBed(s)}
      else if(ac==="compost"){compostAt(s)}
      else if(ac==="cloth"){clothAt(s)}
      else{closeSheet();clearAt(s)}}});
  el("back").onclick=closeSheet;
  el("sndBtn").onclick=function(){Audio2.init();Audio2.setOn(!S.sound)};
  document.addEventListener("click",function(e){var app=el("app");
    if(!app.classList.contains("zen"))return;
    if(e.target.closest&&e.target.closest(".tools"))return;
    app.classList.remove("zen");el("zenHaiku").textContent=""},true);
  window.addEventListener("resize",function(){Scene.resize()});
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){save();return}
    if(tick()){save()}
    render();afterTickUI()});
  window.addEventListener("pagehide",save);
  document.addEventListener("pointerdown",function(){Audio2.init()},{once:true})}
function speciesSheet(id){
  var sp=SP[id];if(!sp)return;
  var a=[],i,f,cmps=[];
  for(i=0;i<CMPKEYS.length;i++){f=CMPKEYS[i].split("+");
    if((f[0]===id||f[1]===id)&&S.disc[f[0]]&&S.disc[f[1]])cmps.push(esc(spName(f[0]===id?f[1]:f[0]))+" "+CMP[CMPKEYS[i]]+"%")}
  a.push('<div class="detailTop"><span>'+plantSVG({prog:1,seeded:false,blooming:true,dormant:false,dead:false,water:1},sp)+"</span>");
  a.push('<span><div class="big">'+esc(spName(id))+(isHyb(id)?' <span class="chip">'+t("hybrid_tag")+"</span>":"")+"</div>");
  a.push('<div class="small">'+pick(SHAPE[sp.sh]||"?")+" ・ "+seasLabel(sp)+" ・ "+esc(pick(sp.note))+"</div></span></div><div class='hr'></div>");
  a.push('<div class="small">'+t("bloomed_n",{n:S.bloomed[id]||0})+(S.disc[id]?"":" ・ "+t("unknown"))+"</div>");
  if(cmps.length)a.push('<div class="small" style="margin-top:6px">'+t("cmp_title")+" ："+cmps.join(" / ")+"</div>");
  if(isHyb(id)&&HYBKEY)for(i=0;i<HYB.length;i++)if(HYB[i][0]===id)
    a.push('<div class="small" style="margin-top:6px">'+parentLabel(HYB[i][1],hintLevel(id))+" × "+parentLabel(HYB[i][2],hintLevel(id))+"</div>");
  a.push('<div style="margin-top:10px"><button class="btn" data-close="1">'+t("close")+"</button></div>");
  openSheet(a.join(""))}
function afterTickUI(){
  if(S.awayDays&&S.awayDays>=3&&view==="garden"&&!el("sheet").classList.contains("on")){showAway();buildNav()}}
/* ---------- 起動 ---------- */
function loop(){
  if(!document.hidden){
    if(tick())save();
    Scene.sky();
    renderHeader();renderStats();renderWx();
    if(view==="garden"){renderBeds();updateBars()}
    afterTickUI()}}
function boot(){
  var first,i,h="",bs;
  initStore();
  CMPKEYS=(function(){var a=[],k;for(k in CMP)if(CMP.hasOwnProperty(k)){var f=k.split("+");if(f[0]<f[1])a.push(k)}return a.sort()})();
  S=loadLocal();first=!S;
  if(first){S=freshState();
    var n=(navigator.language||"ja").toLowerCase();
    S.lang=n.indexOf("zh")===0?"zh":(n.indexOf("en")===0?"en":"ja");
    log("haiku",{v:0});save()}
  lang=S.lang||"ja";document.documentElement.lang=lang;
  Audio2.on=S.sound;Audio2.vol=(S.vol===undefined)?.55:S.vol;
  applyPrefs();
  if(!first){var iv=el("intro");if(iv&&iv.parentNode)iv.parentNode.removeChild(iv)}
  else{
    el("iSub").textContent=t("sub");el("iStart").textContent=t("start");
    for(i=0;i<LANGS.length;i++)h+='<b data-l="'+LANGS[i]+'"'+(LANGS[i]===lang?' class="on"':"")+">"+LNAME[i]+"</b>";
    el("iLang").innerHTML=h;
    bs=document.querySelectorAll("#iLang [data-l]");
    for(i=0;i<bs.length;i++)bs[i].onclick=function(){
      lang=this.getAttribute("data-l");S.lang=lang;save();
      el("iSub").textContent=t("sub");buildNav();render();
      var x=document.querySelectorAll("#iLang [data-l]"),j;
      for(j=0;j<x.length;j++){if(x[j].getAttribute("data-l")===lang)x[j].classList.add("on");else x[j].classList.remove("on")}};
    el("iStart").onclick=function(){
      S.intro=false;Audio2.init();save();
      var e2=el("intro");
      if(e2){e2.style.transition="opacity .9s";e2.style.opacity=0;
        setTimeout(function(){if(e2.parentNode)e2.parentNode.removeChild(e2)},920)}}
    el("iLibs").textContent="PixiJS ・ GSAP ・ Tone.js ・ SortableJS ・ canvas-confetti ・ localForage ・ Google Fonts"}
  Scene.season=seasonOf(S.day);
  Scene.weather=S.wx.today;
  Scene.init();
  buildNav();bind();uiSoundBtn();render();
  tick();render();
  pullIDB(function(){applyPrefs();buildNav();render()});
  setInterval(loop,1500);
  setInterval(function(){Scene.sky()},30000)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>

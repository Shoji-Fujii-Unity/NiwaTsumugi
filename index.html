<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#22301f">
<meta name="description" content="庭つむぎ — めぐる四季、百年の庭。ブラウザだけで動く、ゆっくり育つガーデニングゲーム。">
<title>庭つむぎ — NIWA TSUMUGI</title>

<!-- ▼ ネットから読むライブラリ（全て CDN / 無くても動くよう各機能は存在確認つき） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/pixi.js@7.4.2/dist/pixi.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>

<style>
/* ============ tokens ============ */
:root{
  --s1:#cfe3f2; --s2:#f6e7ee; --s3:#9dbb84; --s4:#5f8257;   /* 空と大地（JSが季節＋時刻で塗る） */
  --sun:#fff3c4; --haze:rgba(255,255,255,.35);
  --ink:#282117; --ink2:#5a5043;
  --paper:rgba(255,252,245,.94); --paper2:rgba(255,252,245,.76);
  --line:rgba(70,55,35,.16); --sh:rgba(22,32,18,.22);
  --leaf:#48784e; --leaf-d:#2f5535; --gold:#d9a93c; --terra:#c96a44; --sky:#6f9fd0; --dew:#57a6c4;
  --wood:#8d6741; --wood-l:#ab8358; --wood-d:#593e24; --soil:#4b3523; --soil-d:#281a10;
  --r:16px;
  --fs:1;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior-y:none}
body{background:radial-gradient(circle at 50% 20%,#1b271b,#0d130d);color:var(--ink);-webkit-user-select:none;user-select:none;
  font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
  font-size:calc(14px * var(--fs))}
h1,h2,.serif{font-family:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;font-weight:600}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:rgba(60,50,35,.28);border-radius:3px}

/* ============ frame ============ */
#app{position:relative;max-width:470px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,var(--s1) 0%,var(--s2) 26%,var(--s3) 44%,var(--s4) 100%);transition:background 2s linear}
body.desk #app{box-shadow:0 0 0 1px rgba(255,255,255,.18),0 22px 60px rgba(0,0,0,.55)}
#scene{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:12}
#stars{position:absolute;inset:0 0 45% 0;pointer-events:none;z-index:2;opacity:0;transition:opacity 2.5s}

/* ============ header ============ */
header{position:relative;z-index:20;padding:calc(env(safe-area-inset-top) + 7px) 12px 6px;
  background:linear-gradient(180deg,rgba(255,253,248,.86),rgba(255,252,244,.52));border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(25,35,20,.07)}
.hrow{display:flex;align-items:center;gap:8px}
.logo{font-size:calc(18.5px * var(--fs));letter-spacing:.16em;line-height:1.05;color:#22301f;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.logo small{display:block;font-size:calc(7.8px * var(--fs));letter-spacing:.28em;opacity:.56;font-weight:500;font-family:inherit;margin-top:1px}
.spacer{flex:1}
#clock{text-align:right;line-height:1.3;font-size:calc(12px * var(--fs))}
#clock b{font-family:"Shippori Mincho B1",serif}
#clock .sub{opacity:.68;font-size:calc(10px * var(--fs))}
.iconbtn{border:1px solid var(--line);background:linear-gradient(180deg,#fffef9,var(--paper2));border-radius:999px;width:34px;height:34px;font-size:15px;
  display:grid;place-items:center;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .15s,box-shadow .2s,border-color .2s;position:relative}
.iconbtn.snd-on{border-color:rgba(77,124,83,.45);box-shadow:0 0 0 2px rgba(142,201,143,.22),0 2px 6px rgba(0,0,0,.08)}
.iconbtn:active{transform:scale(.92)}
#centBar{height:3.5px;background:rgba(255,255,255,.5);border-radius:3px;margin-top:5px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.1)}
#centBar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ab87b,#e8c653,#e58fa9,#82b1d9);transition:width .8s}

/* ============ stage ============ */
#stage{flex:1;position:relative;overflow:hidden;z-index:5;display:flex;flex-direction:column}
#yardWrap{flex:1;overflow:auto;padding:8px 9px;position:relative}
#yardWrap::after{content:"";display:block;height:calc(env(safe-area-inset-bottom) + 162px)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;font-size:calc(10.5px * var(--fs));margin:0 2px 7px}
.chip{border-radius:999px;padding:3px 9.5px;background:linear-gradient(180deg,rgba(255,254,250,.92),rgba(247,242,230,.82));
  border:1px solid var(--line);white-space:nowrap;font-size:calc(10.5px * var(--fs));
  box-shadow:0 1px 3px rgba(0,0,0,.06),inset 0 1px 0 rgba(255,255,255,.8)}
.chip b{font-family:"Shippori Mincho B1",serif;font-size:calc(12px * var(--fs))}
.chip.hot{background:linear-gradient(180deg,#fff3c4,#ffe494);border-color:#d9a93c;font-weight:700;color:#4a3308}
.chip.cold{background:linear-gradient(180deg,#ebf6fd,#d5ecfa);border-color:#82b3d4;color:#1d425c}

/* ---- 予報 ---- */
#wx{display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,rgba(255,253,247,.95),rgba(250,245,235,.88));
  border:1px solid var(--line);border-radius:var(--r);
  padding:8px 11px;margin-bottom:8px;box-shadow:0 4px 12px var(--sh),inset 0 1px 0 rgba(255,255,255,.85);
  backdrop-filter:blur(6px)}
#wx .big{font-size:27px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.12))}
#wx .txt{flex:1;min-width:0}
#wx .t1{font-size:calc(12.5px * var(--fs));font-weight:700}
#wx .t2{font-size:calc(10.5px * var(--fs));opacity:.75;line-height:1.45}
#wx .nx{text-align:right;font-size:calc(9.6px * var(--fs));opacity:.86;line-height:1.42;flex:0 0 33%;max-width:34%;overflow-wrap:anywhere;
  border-left:1px dashed rgba(70,55,35,.16);padding-left:8px}
#wx .nx b{font-size:17px}

/* ---- 今日の庭 ---- */
#today{background:linear-gradient(135deg,rgba(255,248,225,.97),rgba(255,254,250,.92));border:1px solid rgba(200,155,60,.45);
  border-radius:var(--r);padding:10px 12px;margin-bottom:8px;box-shadow:0 5px 16px var(--sh),inset 0 1px 0 #fff}
#today h3{margin:0 0 5px;font-size:calc(13.5px * var(--fs));letter-spacing:.06em}
#today ul{margin:0;padding-left:1.1em;font-size:calc(11.6px * var(--fs));line-height:1.75}
#today .go{margin-top:8px}

/* ============ 庭（描画まわり） ============ */
#yard{position:relative;border-radius:22px;overflow:hidden;
  box-shadow:0 12px 30px rgba(15,24,12,.32),inset 0 0 0 1.5px rgba(255,255,255,.35);
  background:
    radial-gradient(90% 50% at 50% 35%,rgba(255,255,240,.22),transparent 70%),
    linear-gradient(180deg,var(--s1) 0%,var(--s2) 25%,#b8ca98 29%,var(--s3) 42%,var(--s4) 100%);
  transition:background 2s linear}
#skyband{position:relative;height:126px;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0))}
#sunmoon{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;transition:left 1.6s linear,top 1.6s linear;z-index:1}
#sunmoon .sun{position:absolute;inset:9px;border-radius:50%;
  background:radial-gradient(circle at 38% 36%,#fffff8,var(--sun) 52%,#f6cd5b 88%,#e8a938);
  box-shadow:0 0 28px 12px rgba(255,236,165,.62),0 0 56px 24px rgba(255,210,120,.26)}
#sunmoon .sun::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  border:1.5px dashed rgba(255,248,210,.42);animation:sunSpin 36s linear infinite}
@keyframes sunSpin{to{transform:rotate(360deg)}}
#sunmoon.moon .sun{background:radial-gradient(circle at 36% 32%,#ffffff,#eef3fb 56%,#c5d2e4 88%,#9fb0c8);
  box-shadow:0 0 22px 8px rgba(210,228,255,.48),0 0 44px 16px rgba(175,205,255,.2)}
#sunmoon.moon .sun::before{border:1px solid rgba(220,235,255,.22);inset:-5px;animation:none}
#sunmoon.moon .sun::after{content:"";position:absolute;left:22px;top:11px;width:9px;height:9px;border-radius:50%;
  background:rgba(145,162,190,.36);box-shadow:-9px 11px 0 -2px rgba(145,162,190,.28),3px 15px 0 -3px rgba(145,162,190,.24)}
#clouds{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.cloud{position:absolute;opacity:.82;filter:drop-shadow(0 3px 6px rgba(40,55,75,.1));animation:drift var(--cdur,68s) linear infinite}
.cloud path,.cloud ellipse,.cloud circle{fill:rgba(255,255,255,.9)}
#rainbow{position:absolute;left:8%;right:8%;top:12px;height:95px;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.8s}
#treeline{position:absolute;left:0;right:0;bottom:-2px;width:100%;height:80px;display:block;z-index:2}
#hills{position:absolute;left:0;right:0;bottom:22px;width:100%;height:68px;display:block;opacity:.65;z-index:1}
#veil{position:absolute;inset:0;pointer-events:none;z-index:14;
  background:linear-gradient(180deg,rgba(16,24,52,.58),rgba(12,20,38,.42));
  opacity:0;transition:opacity 2s}
#yardglow{position:absolute;inset:0;pointer-events:none;z-index:13;opacity:0;transition:opacity 2s;
  background:radial-gradient(68% 45% at 50% 10%,rgba(255,205,125,.52),rgba(255,150,95,.16) 50%,rgba(255,180,120,0) 78%)}
#decor{position:absolute;left:0;right:0;top:0;height:126px;pointer-events:none;z-index:3;overflow:hidden}
.deco{position:absolute;text-align:center;line-height:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.34));
  display:flex;flex-direction:column;align-items:center;transition:transform .3s}
.deco svg.osvg{width:34px;height:34px;display:block;overflow:visible}
.deco small{display:block;font-size:7.8px;letter-spacing:.03em;color:rgba(255,254,248,.96);
  background:rgba(28,38,24,.52);backdrop-filter:blur(2px);border-radius:999px;padding:1.5px 5.5px;
  text-shadow:0 1px 2px rgba(0,0,0,.8);margin-top:1px;white-space:nowrap}
.ripple{position:absolute;left:50%;top:55%;width:12px;height:6px;margin:-3px 0 0 -6px;border:1.5px solid rgba(255,255,255,.6);
  border-radius:50%;animation:rip 3.4s ease-out infinite}
.ripple:nth-child(2){animation-delay:1.7s}
@keyframes rip{0%{transform:scale(.4);opacity:.9}100%{transform:scale(4);opacity:0}}

#creatures{position:absolute;inset:0;pointer-events:none;z-index:16;overflow:hidden}
.cre{position:absolute;font-size:22px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.cre .tag{position:absolute;left:50%;transform:translateX(-50%);top:-15px;font-size:9px;white-space:nowrap;
  background:rgba(255,253,246,.92);border:1px solid rgba(70,55,35,.18);border-radius:999px;padding:1px 6.5px;color:#3a332b;
  box-shadow:0 2px 4px rgba(0,0,0,.15)}

/* ---- 苗床 ---- */
#beds{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:11px 10px 15px;
  background:
    radial-gradient(circle at 50% 0%,rgba(255,255,240,.18),transparent 65%),
    repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 18px)}
.bed{position:relative;border-radius:14px;min-height:114px;padding:0;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  border:3.5px solid var(--wood);
  background:
    radial-gradient(95% 45% at 50% 88%,rgba(22,12,5,.55),rgba(22,12,5,0) 70%),
    radial-gradient(120% 90% at 50% 120%,rgba(0,0,0,.4),rgba(0,0,0,0) 62%),
    radial-gradient(circle at 22% 32%,rgba(255,245,225,.08) 0 1.8px,transparent 2px),
    radial-gradient(circle at 72% 62%,rgba(0,0,0,.16) 0 2.2px,transparent 2.4px),
    radial-gradient(circle at 45% 78%,rgba(190,155,115,.07) 0 1.5px,transparent 1.8px),
    linear-gradient(180deg,#533b27 0%,var(--soil) 42%,var(--soil-d) 100%);
  background-size:auto,auto,24px 24px,18px 18px,15px 15px,auto;
  box-shadow:
    inset 0 2px 0 rgba(255,235,205,.24),
    inset 0 0 0 1px rgba(45,28,12,.45),
    inset 0 -10px 18px rgba(0,0,0,.46),
    0 5px 11px rgba(15,22,10,.32),
    0 1px 0 rgba(255,255,255,.22);
  transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s}
.bed::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(80% 55% at 50% 82%,rgba(80,155,200,.14),transparent 72%);
  opacity:calc(var(--w,.5) * .9);transition:opacity .6s}
.bed::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#160d06,#0e0803);
  opacity:calc(var(--w,.5) * .42);pointer-events:none;transition:opacity .6s}
.bed:hover{border-color:var(--wood-l)}
.bed:active{transform:translateY(1.5px) scale(.985)}
.bed.wet{box-shadow:inset 0 2px 0 rgba(255,255,255,.22),inset 0 -10px 18px rgba(0,0,0,.45),0 0 0 2.5px rgba(135,200,235,.7),0 5px 11px rgba(0,0,0,.28)}
.bed.wet::before{background:
  repeating-linear-gradient(45deg,rgba(235,248,255,.16) 0 3px,rgba(200,230,250,.06) 3px 7px),
  linear-gradient(180deg,rgba(220,242,255,.24),rgba(175,218,245,.12));opacity:1}
.bed.bloomed{box-shadow:inset 0 2px 0 rgba(255,245,215,.26),inset 0 -10px 18px rgba(0,0,0,.4),0 0 16px rgba(255,230,150,.65),0 5px 11px rgba(0,0,0,.28)}
.bed.ready{animation:readyPulse 2s ease-in-out infinite}
@keyframes readyPulse{50%{box-shadow:inset 0 2px 0 rgba(255,248,220,.3),inset 0 -10px 18px rgba(0,0,0,.4),0 0 0 3px rgba(255,222,105,.92),0 0 18px rgba(255,215,90,.65)}}
.bed.flash{animation:flashBed 1s ease-in-out 3}
@keyframes flashBed{50%{box-shadow:0 0 0 4px rgba(255,214,90,.95),0 0 20px rgba(255,214,90,.8)}}
.bed.lock{border-style:dashed;border-color:rgba(255,255,255,.38);
  background:linear-gradient(180deg,rgba(20,30,18,.26),rgba(15,24,14,.42));color:rgba(255,253,245,.92);align-items:center;justify-content:center;
  font-size:calc(10.5px * var(--fs));text-align:center;gap:3px;backdrop-filter:blur(2px)}
.bed.lock span{font-size:19px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.bed.drop{outline:3px dashed rgba(255,238,170,.95);outline-offset:-6px;transform:scale(1.03)}
.bed.empty .plus{position:absolute;inset:7px;border:1.8px dashed rgba(255,248,232,.34);border-radius:10px;display:grid;place-items:center;
  color:rgba(255,248,232,.76);font-size:20px;transition:border-color .2s,background .2s}
.bed.empty:hover .plus{border-color:rgba(255,248,232,.6);background:rgba(255,255,255,.04)}
.bed svg.plant{width:100%;height:86px;display:block;overflow:visible;position:relative;z-index:1;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.32))}
.bname{position:relative;z-index:2;font-size:calc(9.8px * var(--fs));font-weight:500;
  background:linear-gradient(180deg,rgba(255,253,247,.94),rgba(246,239,225,.88));
  border:1px solid rgba(70,55,35,.18);border-radius:999px;
  padding:1px 8px;margin-bottom:5px;max-width:94%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  box-shadow:0 2px 4px rgba(0,0,0,.22)}
.bbar{position:absolute;left:7px;right:7px;top:5px;height:3.5px;background:rgba(0,0,0,.42);border-radius:3px;overflow:hidden;z-index:2;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.3)}
.bbar i{display:block;height:100%;background:linear-gradient(90deg,#8fd474,#f5df76);border-radius:3px;transition:width .4s}
.bw{position:absolute;left:7px;right:7px;top:10px;height:2.5px;background:rgba(0,0,0,.36);border-radius:2px;overflow:hidden;z-index:2}
.bw i{display:block;height:100%;background:linear-gradient(90deg,#4faee0,#aee6f8);border-radius:2px;transition:width .4s}
.bbadges{position:absolute;top:14px;right:5px;display:flex;flex-direction:column;gap:1px;font-size:11px;z-index:3;
  text-shadow:0 1px 3px rgba(0,0,0,.65);filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.bsoil{position:absolute;bottom:4px;left:6px;font-size:9.5px;opacity:.9;z-index:3;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.plantRoot{transform-origin:30px 89px}
.sway{transform-origin:30px 89px;animation:sw 4.8s ease-in-out infinite}
.bed:nth-child(2n) .sway{animation-duration:5.4s;animation-delay:-1.3s}
.bed:nth-child(3n) .sway{animation-duration:4.3s;animation-delay:-2.7s}
@keyframes sw{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(2.4deg)}}
.droop{transform-origin:30px 89px;transform:rotate(6.5deg) translateY(1.5px) scaleY(.94);transition:transform .5s}
.headBob{transform-origin:0px 0px;animation:hbob 3.6s ease-in-out infinite}
@keyframes hbob{0%,100%{transform:rotate(-1.5deg) scale(1)}50%{transform:rotate(1.8deg) scale(1.025)}}

/* ---- 種ストリップ ---- */
#pouch{position:sticky;bottom:calc(env(safe-area-inset-bottom) + 88px);z-index:13;display:flex;align-items:center;gap:8px;
  margin:9px 2px 0;background:linear-gradient(180deg,rgba(255,253,247,.96),rgba(248,242,229,.92));
  border:1px solid var(--line);border-radius:var(--r);padding:6px 9px;
  box-shadow:0 -3px 16px var(--sh),inset 0 1px 0 #fff;backdrop-filter:blur(8px)}
#pouch .ph{display:flex;flex-direction:column;gap:1px;font-size:calc(8.6px * var(--fs));opacity:.78;margin:0;
  flex:0 0 72px;max-width:72px;line-height:1.3}
#pouch .ph b{font-size:calc(11.5px * var(--fs));opacity:1;color:var(--leaf-d)}
#pouchList{display:flex;gap:7px;overflow-x:auto;padding:5px 5px 4px 2px;min-height:58px;flex:1}
.seed{flex:0 0 auto;width:55px;border:1px solid rgba(110,85,55,.24);border-radius:11px;
  background:linear-gradient(180deg,#fffef9 0%,#f6efe0 70%,#ede2cc 100%);
  padding:3px 2px 3px;text-align:center;cursor:grab;position:relative;
  box-shadow:0 2px 6px rgba(0,0,0,.12),inset 0 1px 0 #fff;transition:transform .15s,box-shadow .15s}
.seed:hover{transform:translateY(-1px);box-shadow:0 4px 8px rgba(0,0,0,.16),inset 0 1px 0 #fff}
.seed svg{width:100%;height:31px;display:block;overflow:visible;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
.seed .sn{font-size:8px;font-weight:500;line-height:1.15;display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:1px}
.seed .sc{position:absolute;top:-5px;right:-4px;background:linear-gradient(180deg,#5c9462,var(--leaf-d));color:#fff;
  border-radius:999px;font-size:9px;font-weight:700;padding:1px 5.5px;
  box-shadow:0 1px 4px rgba(0,0,0,.32),0 0 0 1.5px #fffef9}
.seed.sortable-ghost{opacity:.35}
.seed.sel{outline:2.5px solid var(--leaf);outline-offset:1px;
  background:linear-gradient(180deg,#f3ffe8,#d8efc3);transform:translateY(-2px);
  box-shadow:0 4px 10px rgba(72,120,78,.28)}
#pouch .empty{font-size:calc(11px * var(--fs));opacity:.62;padding:12px 4px}

/* ---- ツールバー ---- */
.tools{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 46px);z-index:24;display:flex;gap:7px;
  padding:7px 9px;background:linear-gradient(180deg,rgba(255,252,244,0),rgba(255,252,244,.88) 38%)}
.tbtn{flex:1;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(180deg,#fffef9,#f4ede0);padding:8px 4px 7px;font-size:calc(11.5px * var(--fs));
  text-align:center;box-shadow:0 4px 10px var(--sh),inset 0 1px 0 #fff;line-height:1.25;transition:transform .12s,box-shadow .2s}
.tbtn small{display:block;font-size:calc(9.2px * var(--fs));opacity:.68;margin-top:1px}
.tbtn:active{transform:translateY(1px)}
.tbtn.pri{background:linear-gradient(180deg,#64a26c,var(--leaf) 65%,var(--leaf-d));color:#fff;border-color:var(--leaf-d);
  box-shadow:0 4px 12px rgba(52,90,58,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.tbtn.dis{opacity:.42}

/* ============ panels ============ */
.panel{flex:1;overflow:auto;padding:9px 11px calc(env(safe-area-inset-bottom) + 130px);display:none;position:relative;z-index:16}
.panel.on{display:block}
.card{background:linear-gradient(180deg,rgba(255,253,248,.96),rgba(250,245,235,.92));border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px;margin-bottom:9px;
  box-shadow:0 4px 14px var(--sh),inset 0 1px 0 rgba(255,255,255,.85);backdrop-filter:blur(6px)}
h2.t{font-size:calc(15px * var(--fs));margin:1px 0 7px;letter-spacing:.05em}
.row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--line);font-size:calc(12.8px * var(--fs))}
.row:first-of-type{border-top:0}
.row .sp{flex:1;min-width:0}
.nm{font-weight:700;font-size:calc(13.2px * var(--fs))}
.sub{font-size:calc(10.8px * var(--fs));opacity:.74;line-height:1.5;margin-top:1px}
.subtabs{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.subtab{border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:5px 12px;font-size:calc(11.4px * var(--fs));
  box-shadow:0 1px 3px rgba(0,0,0,.05)}
.subtab.on{background:linear-gradient(180deg,#5d9865,var(--leaf));color:#fff;border-color:var(--leaf-d);
  box-shadow:0 2px 6px rgba(52,90,58,.28)}
.sws{display:flex;gap:3px;flex:0 0 auto}
.sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(0,0,0,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.hr{height:1px;background:var(--line);margin:9px 0}
.small{font-size:calc(10.8px * var(--fs));opacity:.76;line-height:1.65}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,#fffef9,#f5eee0);border-radius:10px;padding:6px 11px;font-size:calc(12.2px * var(--fs));
  box-shadow:0 2px 5px rgba(0,0,0,.09),inset 0 1px 0 #fff;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,#63a06b,var(--leaf));color:#fff;border-color:var(--leaf-d);box-shadow:0 2px 6px rgba(52,90,58,.28),inset 0 1px 0 rgba(255,255,255,.28)}
.btn.gold{background:linear-gradient(180deg,#f5d27a,var(--gold));color:#3a2b0c;border-color:#b98d22;box-shadow:0 2px 6px rgba(185,141,34,.28),inset 0 1px 0 rgba(255,255,255,.45)}
.btn.dis{opacity:.4;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
textarea{width:100%;min-height:72px;border-radius:10px;border:1px solid var(--line);padding:8px;font-size:10.2px;
  background:#fffdf8;color:#3a332b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
input[type=range]{width:100%;accent-color:var(--leaf)}
.pbar2{height:6px;background:rgba(0,0,0,.12);border-radius:4px;overflow:hidden;margin-top:4px}
.pbar2 i{display:block;height:100%;background:linear-gradient(90deg,#8ec98f,#f3d264)}
.logrow{font-size:calc(12.2px * var(--fs));line-height:1.6;padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.logrow:first-of-type{border-top:0}
.when{flex:0 0 74px;font-size:calc(10.2px * var(--fs));opacity:.6;line-height:1.4;padding-top:2px}
.poem{font-size:calc(13.2px * var(--fs));line-height:2.1;white-space:pre-wrap;font-family:"Shippori Mincho B1","Yu Mincho",serif}
.xbox{border-top:1px solid var(--line);padding:9px 0}
.xbox:first-of-type{border-top:0}
.xq{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:calc(12.4px * var(--fs))}
.hintline{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.glyph{width:38px;height:44px;display:inline-block;flex:0 0 38px}
.glyph.gray{filter:grayscale(1) contrast(.85);opacity:.42}
.detailTop{display:flex;gap:12px;align-items:flex-start}
.detailTop svg{width:82px;height:100px;flex:0 0 82px;
  background:radial-gradient(circle at 50% 62%,rgba(235,225,200,.55),rgba(235,225,200,0) 70%);border-radius:14px}
.big{font-size:calc(18px * var(--fs));font-weight:700;font-family:"Shippori Mincho B1",serif}
.meter{display:flex;align-items:center;gap:7px;font-size:calc(11.4px * var(--fs));margin-top:4px}
.meter .mbar{flex:1;height:7.5px;background:rgba(0,0,0,.12);border-radius:4px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.meter .mbar i{display:block;height:100%;border-radius:4px}
.spark{width:100%;height:46px;display:block;margin-top:4px}

/* ============ nav / sheet / toast ============ */
nav{position:absolute;left:0;right:0;bottom:0;z-index:22;display:flex;
  background:linear-gradient(180deg,rgba(255,253,247,.95),rgba(248,243,232,.97));
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 -2px 12px rgba(25,35,20,.06)}
nav button{flex:1;border:0;background:none;padding:6px 2px 7px;font-size:calc(9.4px * var(--fs));color:var(--ink2);
  display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;transition:color .2s}
nav button .ic{font-size:17px;transition:transform .2s}
nav button.on{color:var(--leaf-d);font-weight:700}
nav button.on .ic{transform:translateY(-1px) scale(1.06)}
nav button.on::before{content:"";position:absolute;top:0;left:24%;right:24%;height:2.5px;background:linear-gradient(90deg,#7ab87b,var(--leaf));border-radius:2px}
nav button .dot{position:absolute;top:4px;right:24%;width:6px;height:6px;border-radius:50%;background:var(--terra);
  box-shadow:0 0 0 2px rgba(255,252,244,.9)}
#back{position:absolute;inset:0;z-index:35;background:rgba(16,22,12,.52);opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px)}
#back.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:40;background:linear-gradient(180deg,#fffef9,#f6efe0);
  border-radius:22px 22px 0 0;transform:translateY(115%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  padding:6px 14px calc(env(safe-area-inset-bottom) + 14px);max-height:82%;overflow:auto;
  box-shadow:0 -10px 32px rgba(0,0,0,.32),inset 0 1px 0 #fff}
#sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:3px;background:rgba(0,0,0,.16);margin:4px auto 8px}
#toasts{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 56px);z-index:60;display:flex;flex-direction:column;
  align-items:center;gap:6px;pointer-events:none;padding:0 14px}
.toast{background:linear-gradient(180deg,rgba(38,48,32,.94),rgba(26,34,22,.94));color:#fbf7ec;
  border:1px solid rgba(255,255,255,.16);font-size:calc(12.2px * var(--fs));padding:7.5px 15px;border-radius:999px;
  text-align:center;line-height:1.45;box-shadow:0 6px 18px rgba(0,0,0,.34);backdrop-filter:blur(4px)}
#errbox{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 40px);z-index:99;background:#5c1a12;color:#ffe;
  display:none;padding:10px;border-radius:10px;font-size:10px;font-family:ui-monospace,monospace;white-space:pre-wrap;max-height:40%;overflow:auto}

/* ============ intro ============ */
#intro{position:absolute;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:26px;color:#f8f4e8;backdrop-filter:blur(10px);
  background:radial-gradient(120% 55% at 50% 4%,rgba(255,232,170,.24),rgba(255,232,170,0) 62%),
    linear-gradient(180deg,#395a42,#223727 56%,#111c15)}
#intro h1{font-size:40px;letter-spacing:.3em;margin:0 0 4px;text-shadow:0 3px 18px rgba(0,0,0,.5)}
#intro .rm{font-size:9.5px;letter-spacing:.42em;opacity:.75;margin-bottom:16px}
#intro .art{width:240px;height:102px;margin-bottom:12px;opacity:.96;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35))}
#intro p{font-size:calc(12.6px * var(--fs));line-height:2;max-width:310px;margin:0 0 22px}
#intro button{border:1px solid rgba(255,255,255,.68);background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.12));
  color:#fff;border-radius:999px;padding:12px 34px;font-size:14px;letter-spacing:.12em;
  box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,background .2s}
#intro button:active{transform:scale(.96)}
#intro .lg{display:flex;gap:8px;margin-top:20px;font-size:11px;flex-wrap:wrap;justify-content:center}
#intro .lg b{opacity:.65;font-weight:400;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:3px 11px;cursor:pointer}
#intro .lg b.on{opacity:1;background:#fffdf7;color:#26301f;border-color:transparent;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#intro .libs{margin-top:18px;font-size:9.5px;opacity:.5;letter-spacing:.08em;line-height:1.8}

/* ============ zen ============ */
#app.zen header,#app.zen nav,#app.zen .tools,#app.zen .chiprow,#app.zen #wx,#app.zen #today,#app.zen #pouch{display:none}
#app.zen #yardWrap{padding:0}
#app.zen #yard{border-radius:0;box-shadow:none;min-height:100dvh}
#zenHint{display:none;position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:26;
  text-align:center;font-size:11px;color:rgba(255,255,255,.9);text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#app.zen #zenHint{display:block}
#zenHaiku{display:none;position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 20px);z-index:26;text-align:center;
  color:#fffdf3;font-family:"Shippori Mincho B1",serif;font-size:15px;line-height:2.1;white-space:pre-wrap;
  text-shadow:0 2px 12px rgba(0,0,0,.65);pointer-events:none}
#app.zen #zenHaiku{display:block}

/* ============ scene extras ============ */
@keyframes drift{0%{transform:translateX(-150px)}100%{transform:translateX(500px)}}
@keyframes flick{0%,100%{opacity:0}3%{opacity:.88}7%{opacity:.12}11%{opacity:.75}16%{opacity:0}}
#flash{position:absolute;inset:0;background:#f2f7ff;opacity:0;pointer-events:none;z-index:17}
#flash.on{animation:flick 1.5s ease-out 1}
.cre.walk{animation:walk var(--dur,16s) linear 1 forwards}
.cre.fly{animation:fly var(--dur,12s) ease-in-out 1 forwards}
@keyframes walk{0%{left:-10%;opacity:0}10%{opacity:1}88%{opacity:1}100%{left:102%;opacity:0}}
@keyframes fly{0%{left:-10%;top:60%;opacity:0}12%{opacity:1}30%{top:26%}52%{top:52%}70%{top:18%}88%{opacity:1}100%{left:100%;top:40%;opacity:0}}
.bird{position:absolute;font-size:13px;opacity:.85;animation:fly var(--dur,20s) linear 1 forwards}
body.calm .sway,body.calm .headBob,body.calm .cloud,body.calm .ripple,body.calm #sunmoon .sun::before{animation:none}
body.calm #scene{opacity:.55}
@media (prefers-reduced-motion: reduce){.sway,.headBob,.cloud,.ripple,#sunmoon .sun::before{animation:none}}
@media (min-width:520px){ :root{--r:18px} }
</style>
</head>

<script id="TXT" type="text/plain">
# 庭つむぎ データ（書式: key=ja|en|zh / 行内 ; は区切り、本文に ; と | は使わない）

[ui]
sub=めぐる四季、百年の庭。種一粒から、あなたの庭の歴史を編みます。|A century of seasons, woven from a single seed.|四季流转的百年之庭，从一粒种子编织属于你的庭园史。
start=庭をはじめる|Begin the garden|开始园艺
nav_garden=庭|Garden|花园
nav_seed=種の市|Market|市场
nav_book=図鑑|Almanac|图鉴
nav_log=年表|Chronicle|年表
nav_set=設定|Settings|设置
year_n=第{n}年|Year {n}|第{n}年
day_of={s}{d}日|{s} day {d}|{s}第{d}天
renown=名声|Renown|声望
dew=雫|Dew|露珠
compost=たい肥|Compost|堆肥
cloth=寒冷紗|Frost Cloth|防寒布
can_n=じょうろ Lv{n}|Can Lv{n}|水壶 Lv{n}
hg_none=満杯|full|已满
hg_use=一日すすめる|Pass a day|推进一天
hg_left=あと{t}|in {t}|还需{t}
water_all=まき散らす|Water all|整体浇水

  var raw=el("TXT").textContent.split("\n"),sec="",i,line,f,k,key,val;
  for(i=0;i<raw.length;i++){
    line=raw[i].trim();
    if(!line||line.charAt(0)==="#")continue;
    if(line.charAt(0)==="["){sec=line.slice(1,-1).trim();continue}
    if(sec==="ui"||sec==="ct"||sec==="shape"){
      k=line.indexOf("=");
      if(k<0){warn("skip "+sec+": "+line);continue}
      key=line.slice(0,k);val=line.slice(k+1);
      if(sec==="ui")U[key]=val;else if(sec==="ct")CT[key]=val;else SHAPE[key]=val;
      continue
    }
    f=line.split(";");
    if(sec==="sp"){
      if(f.length<17){warn("skip sp: "+f[0]);continue}
      SP[f[0]]={id:f[0],n:f[1],sh:f[2],c1:f[3],c2:f[4],h:+f[5],germ:+f[6],life:+f[7],wit:+f[8],
        per:f[9]==="1",seas:f[10],rar:+f[11],price:+f[12],seedn:+f[13],val:+f[14],note:f[15],sp:f[16]}
    }else if(sec==="hyb"){
      if(f.length<3)continue;HYB.push(f);HYBKEY[f[1]+"+"+f[2]]=f[0];HYBKEY[f[2]+"+"+f[1]]=f[0]
    }else if(sec==="cmp"){
      if(f.length<3)continue;var w=+f[2];CMP[f[0]+"+"+f[1]]=w;CMP[f[1]+"+"+f[0]]=w
    }else if(sec==="vis"){ if(f.length<5)continue;VIS.push(f);VISN[f[0]]=f }
    else if(sec==="orn"){ if(f.length<5)continue;ORN.push(f);ORNM[f[0]]=f }
    else if(sec==="wx"){ if(f.length<5)continue;WX[f[0]]={id:f[0],n:f[1],ic:f[2],g:+f[3],ev:+f[4]};WXID.push(f[0]) }
    else if(sec==="evt"){ if(f.length<3)continue;EVT[f[0]]={id:f[0],ic:f[1],n:f[2]} }
    else if(sec==="mile"){ if(f.length<4)continue;MILE.push([f[0],f[1],+f[2],+f[3]]) }
    else if(sec==="season"){ SEASONS.push(line) }
    else if(sec==="cp"){ CP.push(line) }
    else if(sec==="yp"){ var p2=line.split(";");if(p2.length<2)continue;
      var si=+p2[0];if(si<0||si>3)si=0;HAIKU[si].push(p2.slice(1).join(";")) }
  }
  for(i=0;i<MILE.length;i++)MILEN[MILE[i][0]]=MILE[i];
  SPIDS=Object.keys(SP);
})();

function emptyArr(){return [null,null,null,null,null,null,null,null,null,null,null,null]}
function nArr(n,v){var a=[],i;for(i=0;i<n;i++)a.push(v);return a}
function baseOpen(){var a=nArr(NBED,false),i;for(i=0;i<BASE_BEDS;i++)a[i]=true;return a}
function freshState(){
  return {v:3,lang:null,sound:true,vol:0.55,speed:2,calm:false,fs:1,lastReal:Date.now(),day:0,
    plots:emptyArr(),soil:nArr(NBED,0.75),cloth:nArr(NBED,false),bedOpen:baseOpen(),
    pouch:{dandelion:2,tulip:1,crocus:1},dew:24,renown:0,compost:2,clothN:1,hg:1,hgAt:Date.now(),

function normState(o){

  s.buffs=Object.assign({grow:0,growM:1,shop:0},(o&&o.buffs)||{});
  s.wx=Object.assign({today:"clear",tomA:"clear",tomS:"clear"},(o&&o.wx)||{});
  s.day=typeof s.day==="number"&&isFinite(s.day)?Math.max(0,s.day):0;
  s.century=typeof s.century==="number"&&isFinite(s.century)?Math.max(1,Math.floor(s.century)):1;
  s.legacy=typeof s.legacy==="number"&&isFinite(s.legacy)?Math.max(0,Math.floor(s.legacy)):0;

  s.fs=typeof s.fs==="number"&&isFinite(s.fs)?clamp(s.fs,.92,1.14):1;

  s.lang=LANGS.indexOf(s.lang)>=0?s.lang:null;

  s.buffs.growM=typeof s.buffs.growM==="number"&&isFinite(s.buffs.growM)?clamp(s.buffs.growM,.5,3):1;
  s.buffs.shop=typeof s.buffs.shop==="number"&&isFinite(s.buffs.shop)?Math.max(0,Math.floor(s.buffs.shop)):0;
  s.intro=!!s.intro;
  s.calm=!!s.calm;
  s.sound=s.sound!==false;
  s.centDone=!!s.centDone;
  s.todaySeen=typeof s.todaySeen==="number"&&isFinite(s.todaySeen)?Math.floor(s.todaySeen):-1;
  s.legacy=typeof s.legacy==="number"&&isFinite(s.legacy)?Math.max(0,Math.floor(s.legacy)):0;
  if(!Array.isArray(s.plots)||s.plots.length!==NBED)s.plots=emptyArr();
  if(!Array.isArray(s.soil)||s.soil.length!==NBED)s.soil=nArr(NBED,0.75);
  if(!Array.isArray(s.cloth)||s.cloth.length!==NBED)s.cloth=nArr(NBED,false);
  if(!Array.isArray(s.bedOpen)||s.bedOpen.length!==NBED)s.bedOpen=baseOpen();
  for(var ni=0;ni<NBED;ni++){
    s.soil[ni]=typeof s.soil[ni]==="number"&&isFinite(s.soil[ni])?clamp(s.soil[ni],0,1):.75;
    s.cloth[ni]=!!s.cloth[ni];
    s.bedOpen[ni]=!!s.bedOpen[ni];
  }
  for(var bi=0;bi<BASE_BEDS;bi++)s.bedOpen[bi]=true;
  for(var pi=0;pi<NBED;pi++){
    var plot=s.plots[pi];
    if(!plot||typeof plot!=="object"||!SP[plot.sp]){
      s.plots[pi]=null;continue;
    }
    plot.prog=typeof plot.prog==="number"&&isFinite(plot.prog)?clamp(plot.prog,0,1):0;
    plot.bloomAge=typeof plot.bloomAge==="number"&&isFinite(plot.bloomAge)?Math.max(0,plot.bloomAge):0;
    plot.water=typeof plot.water==="number"&&isFinite(plot.water)?clamp(plot.water,0,1):.85;
    plot.ext=typeof plot.ext==="number"&&isFinite(plot.ext)&&plot.ext>0?plot.ext:1;
    plot.seeded=!!plot.seeded;plot.dead=!!plot.dead;plot.blooming=!!plot.blooming;

  }
  if(!WX[s.wx.today])s.wx.today="clear";
  if(!WX[s.wx.tomA])s.wx.tomA=s.wx.today;
  if(!WX[s.wx.tomS])s.wx.tomS=s.wx.tomA;
  if(!SPEEDS[s.speed])s.speed=2;
  if(!s.bloomY||typeof s.bloomY!=="object")s.bloomY={};
  if(!s.pouch||typeof s.pouch!=="object")s.pouch={};
  if(!s.disc||typeof s.disc!=="object")s.disc={};
  if(!s.bloomed||typeof s.bloomed!=="object")s.bloomed={};
  if(!s.visited||typeof s.visited!=="object")s.visited={};
  if(!s.hybTry||typeof s.hybTry!=="object")s.hybTry={};
  if(!s.hintLvl||typeof s.hintLvl!=="object")s.hintLvl={};
  if(!s.ms||typeof s.ms!=="object")s.ms={};
  if(!s.orn||typeof s.orn!=="object")s.orn={};
  if(!s.seenSeason||typeof s.seenSeason!=="object")s.seenSeason={};
  if(!s.wxHist||typeof s.wxHist!=="object")s.wxHist={};
  if(!Array.isArray(s.chron))s.chron=[];
  for(var pk in s.pouch)if(s.pouch.hasOwnProperty(pk)){
    s.pouch[pk]=typeof s.pouch[pk]==="number"&&isFinite(s.pouch[pk])?Math.max(0,Math.floor(s.pouch[pk])):0;
  }
  for(var sk in s.stats)if(s.stats.hasOwnProperty(sk)){
    s.stats[sk]=typeof s.stats[sk]==="number"&&isFinite(s.stats[sk])?Math.max(0,s.stats[sk]):0;
  }
  return s}

function discCount(){return Object.keys(S.disc).length}
function hybCount(){var n=0,i;for(i=0;i<HYB.length;i++)if(S.disc[HYB[i][0]])n++;return n}
function isHyb(id){return !!(SP[id]&&SP[id].sp==="h")}
function inSeason(sp,seas){var k=["w","s","m","a"][seas];return sp.seas.indexOf("*")>=0||sp.seas.indexOf(k)>=0}
function spName(id){return SP[id]?pick(SP[id].n):id}
function bedUnlocked(i){return !!S.bedOpen[i]}
function openCost(i){return {dew:25*(i-BASE_BEDS+1),compost:1+Math.floor((i-BASE_BEDS)/2)}}
function openBed(i){
  var c=openCost(i);
  if(i<BASE_BEDS||S.bedOpen[i]||S.renown<PLOTREQ[i]){Sfx.no();return}
  if(S.dew<c.dew||S.compost<c.compost){
    toast(fmt(t("open_cost"),{n:c.dew,c:c.compost})+" / "+t("dew")+" "+Math.floor(S.dew)+" ・ "+t("compost")+" "+S.compost);Sfx.no();return}
  S.dew-=c.dew;S.compost-=c.compost;S.bedOpen[i]=true;S.stats.open++;S.renown+=2;log("openbed");
  Sfx.mile();save();renderBeds(true)}
function neighbours(i){var cols=3,r=Math.floor(i/cols),c=i%cols,ns=[];
  if(c>0)ns.push(i-1);if(c<cols-1)ns.push(i+1);if(r>0)ns.push(i-cols);if(r<3)ns.push(i+cols);return ns}
function soilMult(i){return 0.82+0.36*clamp(S.soil[i]||0,0,1)}
function cmpPairs(i){
  var p=S.plots[i],out=[],ns=neighbours(i),k,q,w;
  if(!p||p.dead)return out;
  for(k=0;k<ns.length;k++){q=S.plots[ns[k]];if(!q||q.dead)continue;
    w=CMP[p.sp+"+"+q.sp];if(w!==undefined)out.push({j:ns[k],w:w,other:q.sp})}
  return out}
function cmpMult(i){
  var ps=cmpPairs(i),sum=0,k;
  for(k=0;k<ps.length;k++)sum+=ps[k].w;
  if(S.orn.arch&&sum>0)sum=Math.round(sum*1.5);
  return clamp(1+sum/100,0.78,1.32)}
function gardenBonus(){
  var b=1,m=0,i,p;
  for(i=0;i<NBED;i++){p=S.plots[i];if(!p||p.dead||p.dormant||p.prog<1)continue;
    if(p.sp==="moss")m++;if(p.sp==="centgrass")b+=0.2}
  if(m>5)m=5;return b*(1+m*0.03)}
function buffGrow(){return (S.buffs.grow>0)?(S.buffs.growM||1.1):1}
function canLevel(){return S.can||1}

/* ---------- [C] シミュレーション ---------- */
var WXW=[
  {clear:.32,cloudy:.20,rain:.24,storm:.05,mist:.14,frost:.05},
  {clear:.42,cloudy:.18,rain:.20,storm:.18,mist:.02},
  {clear:.32,cloudy:.22,rain:.22,storm:.05,mist:.14,frost:.05},
  {clear:.22,cloudy:.22,rain:.06,mist:.14,frost:.30,snow:.28}];
function rollWeather(seas){
  var w=WXW[seas]||WXW[0],tot=0,k;
  for(k in w)if(w.hasOwnProperty(k)&&WX[k])tot+=w[k];
  var r=Math.random()*tot;
  for(k in w){if(!w.hasOwnProperty(k)||!WX[k])continue;r-=w[k];if(r<=0)return k}
  return "clear"}
function forecastOK(){return Math.random()<(S.orn.weathervane?1:0.74)}
function isWet(){var w=S.wx.today;return w==="rain"||w==="storm"}
function tick(){
  if(!S)return false;
  var now=Date.now(),elapsed=(now-S.lastReal)/MS_DAY(),days=elapsed,guard=0,away,step;
  if(days<0)days=0;
  if(days<=0.0002){hgRefresh();return false}
  elapsed=Math.max(0,elapsed);away=elapsed>0.30;catching=true;
  while(days>0.0002&&guard<10000){step=Math.min(1,days);advance(step);days-=step;guard++}
  if(days>0.0002){S.day+=days;resolve(days)}
  catching=false;S.lastReal=now;hgRefresh();
  if(away)S.awayDays=Math.max(1,Math.round(elapsed));
  return true}
function advance(dt){
  var b=Math.floor(S.day)+1;S.day+=dt;resolve(dt);
  while(b<=Math.floor(S.day)){onDay(b);b++}}
function stageOf(p){
  if(p.dead)return "withered";if(p.dormant)return "dormant";
  if(p.prog>=1)return p.seeded?"seeded":"bloom";
  if(p.prog<0.12)return "seed";if(p.prog<0.34)return "sprout";
  if(p.prog<0.78)return "grow";return "bud"}
function resolve(dt){
  var seas=seasonOf(S.day),gb=gardenBonus(),wg=wxOf(S.wx.today).g,bf=buffGrow(),i,p,sp,m;
  for(i=0;i<NBED;i++){p=S.plots[i];if(!p||p.dead)continue;sp=SP[p.sp];if(!sp)continue;
    if(p.dormant){if(inSeason(sp,seas)&&p.water>0.2)p.dormant=false;else continue}
    m=wg*(inSeason(sp,seas)?1:(S.orn.greenhouse?0.55:0.09))*soilMult(i)*cmpMult(i)*bf*gb*(1+0.04*S.century)*(1+0.03*S.legacy);
    if(p.water<0.12)m*=0.08;else if(p.water<0.35)m*=0.6;
    if(p.prog<1){p.prog=Math.min(1,p.prog+dt/sp.germ*m);if(p.prog>=1)doBloom(i,sp,p)}
    else{p.bloomAge+=dt*Math.max(0.25,m)*0.9;
      if(!p.seeded&&p.bloomAge>=sp.life*0.55)p.seeded=true;
      if(p.bloomAge>=sp.life*(p.ext||1)+sp.wit)endLife(i,sp,p)}}}
function doBloom(i,sp,p){
  var first=!S.disc[sp.id];
  p.prog=1;p.blooming=true;p.bloomAge=0;p.seeded=false;p.pruned=false;
  S.stats.bloom++;S.seenSeason[seasonOf(S.day)]=true;S.disc[sp.id]=true;
  S.bloomed[sp.id]=(S.bloomed[sp.id]||0)+1;
  if(S.bloomY)S.bloomY[yearOf(S.day)]=(S.bloomY[yearOf(S.day)]||0)+1;
  if(first){S.renown+=3;addDew(6);log("bloom1",{sp:sp.id});
    if(!catching){toast(t("new_species",{sp:"<b>"+esc(spName(sp.id))+"</b>"}),2900);Pop.bloom(i)}}
  checkHybrid(i,sp);checkMile()}
function endLife(i,sp,p){
  if(sp.per&&!p.forced){p.dormant=true;p.blooming=false;p.seeded=false;p.bloomAge=0;p.prog=0.55;
    log("dormant",{sp:sp.id});return}
  p.dead=true;p.blooming=false;p.seeded=false;p.forced=false;
  S.soil[i]=clamp((S.soil[i]||0)-0.04,0,1);log("wither",{sp:sp.id})}
function onDay(d){
  var seas=seasonOf(S.day),i,p;
  /* 天候をめくる（明日の実天候はすでに決めておく＝予報の的中率が成立する） */
  S.wx.today=S.wx.tomA;
  var rp=rollWeatherPair(seas);
  S.wx.tomA=rp.actual;S.wx.tomS=rp.shown;
  S.wxHist[S.wx.today]=(S.wxHist[S.wx.today]||0)+1;
  applyWeather(seas);
  /* 水分 */
  var ev=wxOf(S.wx.today).ev;
  if(S.orn.birdbath)ev*=0.85;
  if(canLevel()>=3)ev*=0.9;
  for(i=0;i<NBED;i++){p=S.plots[i];if(!p||p.dead)continue;
    p.water=Math.max(0,(p.water||0)-ev);
    if(isWet())p.water=1;else if(S.wx.today==="mist")p.water=Math.min(1,p.water+0.14);
    if(isWet())S.soil[i]=clamp((S.soil[i]||0)+0.012,0,1)}
  if(S.orn.well&&!isWet()&&Math.random()<0.6){
    for(i=0;i<NBED;i++){p=S.plots[i];if(p&&!p.dead)p.water=Math.min(1,p.water+0.4)}}
  if(S.orn.birdbath){for(i=0;i<NBED;i++){p=S.plots[i];if(p&&!p.dead)p.water=Math.min(1,p.water+0.06)}}

  if(p.dead){
    g.push('<path d="M30 89 C 35 64 42 46 48 46" stroke="#8a7250" stroke-width="2.2" fill="none" stroke-linecap="round"/>');
    g.push('<path d="M33 70 C 39 67 43 70 44 73" stroke="#786142" stroke-width="1.4" fill="none"/>');
    g.push('<circle cx="48" cy="47" r="3.4" fill="#b39a72"/>');
    g.push('<path d="M30 89 C 26 74 21 67 17 65" stroke="#8a7250" stroke-width="1.6" fill="none" opacity=".8" stroke-linecap="round"/>');

  if(p.dormant){

    g.push('<path d="M28 87 Q29 82 27 80 M31 87 Q32 83 34 81" stroke="#96a87e" stroke-width="1.3" fill="none" stroke-linecap="round"/>');
    return '<svg class="plant" viewBox="0 0 60 96">'+g.join("")+"</svg>"}
  var stemH=sp.h*(.26+.74*pr),topY=89-stemH,dry=(p.water<0.28&&!p.dormant);
  var col=dry?"#7f8b52":"#487542",colL=dry?"#96a368":"#689c5e";
  if(pr>=1&&!dry)g.push('<circle cx="30" cy="'+topY.toFixed(1)+'" r="15" fill="'+sp.c1+'" opacity=".14"/>');
  pg.push('<path d="M30 89 C 28.5 '+(89-stemH*.55).toFixed(1)+', 31.5 '+(topY+stemH*.25).toFixed(1)+', 30 '+topY.toFixed(1)+
    '" stroke="'+col+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>');
  pg.push('<path d="M29.6 88.5 C 28.2 '+(89-stemH*.55).toFixed(1)+', 31.1 '+(topY+stemH*.25).toFixed(1)+', 29.7 '+topY.toFixed(1)+
    '" stroke="'+colL+'" stroke-width=".9" fill="none" stroke-linecap="round" opacity=".7"/>');
  if(pr>0.16){
    ly=89-stemH*.38;ll=4.8+6.4*pr;
    pg.push(leafPair(ly,ll,dry));
  }

    pg.push(leafPair(89-stemH*.66,(4.2+5.2*pr)*.78,dry));

  if(pr<0.78)inner=sproutShape(pr);

    if(p.pruned)inner+='<circle cx="0" cy="4" r="1.6" fill="#8fbf7a"/>'}
  /* 根元 (30,89) を基準に株全体を揺らし、translate(30,topY) の上書きバグを防ぐ */
  pg.push('<g transform="translate(30,'+topY.toFixed(1)+')"><g class="'+(dry?"":"headBob")+'">'+inner+"</g></g>");
  g.push('<g class="plantRoot '+(dry?"droop":"sway")+'">'+pg.join("")+"</g>");
  return '<svg class="plant" viewBox="0 0 60 96">'+g.join("")+"</svg>"}

/* ---------- [E] 行動 ---------- */
function ownList(){var a=[],i;for(i=0;i<SPIDS.length;i++)if(S.pouch[SPIDS[i]]>0)a.push(SPIDS[i]);return a}
function plantAt(i,id){
  var sp=SP[id];

  if(sp.sp==="pond"&&!S.orn.pond){toast(t("need_pond"));Sfx.no();return false}
  S.pouch[id]--;
  S.plots[i]={sp:id,prog:0,bloomAge:0,water:0.85,seeded:false,dead:false,blooming:false,
    dormant:!inSeason(sp,seasonOf(S.day)),pruned:false,ext:1};
  S.soil[i]=clamp((S.soil[i]||0)-0.09,0,1);
  S.stats.plant++;S.disc[id]=true;log("plant",{sp:id});Sfx.plant();
  save();renderBeds(true);renderPouch();renderStats();
  Pop.bounce(i,.35,.7,"back.out(2)");
  return true}
function waterTargets(){var a=[],i,p;for(i=0;i<NBED;i++){p=S.plots[i];if(p&&!p.dead&&(p.water||0)<0.95)a.push(i)}return a}
function waterAt(i){var p=S.plots[i];
  if(!p||p.dead)return false;
  if(p.water>0.92){Sfx.no();return false}
  p.water=1;S.stats.water++;Sfx.water();Pop.water(i);save();renderBeds();renderToday();return true}
function waterAll(){
  var lvl=canLevel(),lim=(lvl>=3?2:1);
  if(S.waterUses>=lim){toast(t("done_watered"));Sfx.no();return}
  var tg=waterTargets();
  if(!tg.length){toast(t("done_watered"));Sfx.no();return}
  if(lvl===1)tg=tg.slice(0,3);
  var i,k,p;for(k=0;k<tg.length;k++){p=S.plots[tg[k]];if(p){p.water=1;S.stats.water++}}
  S.waterUses++;Sfx.water();
  for(i=0;i<Math.min(3,tg.length);i++)Pop.water(tg[i]);
  save();renderBeds();renderToday();renderTools()}
function harvestAt(i){
  var p=S.plots[i],sp,r,seeds,v;
  if(!p||!p.blooming)return;
  sp=SP[p.sp];r=p.seeded;seeds=Math.max(1,Math.round(sp.seedn*(r?1:0.4)));
  if(S.orn.potbench)seeds+=1;
  S.pouch[sp.id]=(S.pouch[sp.id]||0)+seeds;
  v=Math.round(sp.val*(r?1:0.45)*(1+Math.min(0.6,S.renown/900))*(1+0.08*S.legacy));
  addDew(v);S.stats.harvest++;S.renown+=1;S.soil[i]=clamp((S.soil[i]||0)-0.08,0,1);
  Sfx.harvest();Pop.burst(Pop.rect(i),[sp.c1,sp.c2,"#f6e6a8"],26,80,.5);
  toast("<b>"+esc(spName(sp.id))+"</b> "+t("got_seeds",{n:seeds})+" / "+t("got_dew",{n:v}),2500);
  S.plots[i]=null;save();render()}
function pruneAt(i){
  var p=S.plots[i];
  if(!p||!p.blooming||p.pruned){Sfx.no();return}
  p.pruned=true;p.ext=1.45;S.stats.prune++;S.renown+=2;Sfx.prune();
  Pop.burst(Pop.rect(i),["#cfe9b4","#ffffff"],12,50,.7);
  save();renderBeds();renderToday()}
function clearAt(i){
  var p=S.plots[i],gain=0;
  if(!p)return;
  if(p.dead){gain=S.orn.compost?2:1;S.compost+=gain;log("compost");
    toast(t("compost_get"),1800)}
  S.plots[i]=null;S.cloth[i]=false;addDew(1);Sfx.tap();save();render()}
function compostAt(i){
  if(S.compost<1){Sfx.no();return}

  Sfx.plant();save();renderBeds();renderStats();renderSheetBed(i)}

function seedPrice(id){var sp=SP[id],c=Math.round(sp.price*(S.disc[id]?1:1.6));
  if(S.buffs.shop>0)c=Math.max(1,Math.round(c*0.7));return c}

/* ---- 交配図鑑 ---- */
function livePairs(){
  var out=[],i,p,ns,k,j,q,hid;
  for(i=0;i<NBED;i++){p=S.plots[i];if(!p||!p.blooming||p.dead)continue;
    ns=neighbours(i);

      q=S.plots[j];if(!q||!q.blooming||q.dead)continue;
      hid=HYBKEY[p.sp+"+"+q.sp];if(hid)out.push({a:i,b:j,hid:hid})}}

function hintCost(hid){return 14*(hintLevel(hid)+1)}
function buyHint(hid){

  Audio2.on=S.sound;Audio2.vol=(S.vol===undefined)?.55:S.vol;
  applyPrefs();
  if(!first){var iv=el("intro");if(iv&&iv.parentNode)iv.parentNode.removeChild(iv)}
  else{
    el("iSub").textContent=t("sub");el("iStart").textContent=t("start");
    for(i=0;i<LANGS.length;i++)h+='<b data-l="'+LANGS[i]+'"'+(LANGS[i]===lang?' class="on"':"")+">"+LNAME[i]+"</b>";
    el("iLang").innerHTML=h;
    bs=document.querySelectorAll("#iLang [data-l]");
    for(i=0;i<bs.length;i++)bs[i].onclick=function(){
      lang=this.getAttribute("data-l");S.lang=lang;save();
      el("iSub").textContent=t("sub");buildNav();render();
      var x=document.querySelectorAll("#iLang [data-l]"),j;
      for(j=0;j<x.length;j++){if(x[j].getAttribute("data-l")===lang)x[j].classList.add("on");else x[j].classList.remove("on")}};
    el("iStart").onclick=function(){
      S.intro=false;Audio2.init();save();
      var e2=el("intro");
      if(e2){e2.style.transition="opacity .9s";e2.style.opacity=0;
        setTimeout(function(){if(e2.parentNode)e2.parentNode.removeChild(e2)},920)}}
    el("iLibs").textContent="PixiJS ・ GSAP ・ Tone.js ・ SortableJS ・ canvas-confetti ・ localForage ・ Google Fonts"}
  Scene.season=seasonOf(S.day);
  Scene.weather=S.wx.today;
  Scene.init();
  buildNav();bind();uiSoundBtn();render();
  tick();render();
  pullIDB(function(){applyPrefs();buildNav();render()});
  setInterval(loop,1500);
  setInterval(function(){Scene.sky()},30000)}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);else boot();
</script>

</body>
</html>
